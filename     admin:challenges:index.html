<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>📅 チャレンジ管理</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0a10;--panel:#17131e;--line:#4e415e;--text:#f7f2ff;--muted:#b9aec8;--accent:#8f6cff;--ok:#75d99b;--danger:#ff7b8f}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#130c1e,#09070d);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:30;background:#0b0910e8;backdrop-filter:blur(12px);border-bottom:1px solid #3b3047;padding:10px}
.wrap{width:min(920px,100%);margin:auto;padding:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 9px}h3{font-size:14px;margin:12px 0 6px}.muted{font-size:11px;color:var(--muted);line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label{display:block;font-size:11px;color:#d9cfe5;margin-bottom:4px}input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;background:#0d0b12;color:#fff;border:1px solid #574868;border-radius:11px;padding:10px}
textarea{min-height:90px;resize:vertical}button{border:0;border-radius:11px;padding:10px 12px;font-weight:800;background:#352944;color:#fff}
button.primary{background:linear-gradient(135deg,#7752df,#a565ff)}button.ok{background:#27583c}button.danger{background:#672b38}button:disabled{opacity:.45}
.row{display:flex;gap:7px;flex-wrap:wrap}.row>*{flex:1}.list{display:grid;gap:7px}.item{border:1px solid #463a54;background:#100d15;border-radius:12px;padding:9px}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#2b2237;font-size:10px;color:#d8c9ed}.status{font-size:11px;padding:7px 9px;border-radius:9px;background:#10151d;color:#cce3f5;margin-top:7px}
.hidden{display:none!important}.thumb{width:100%;max-height:220px;object-fit:contain;background:#09070b;border-radius:10px;margin-top:7px}
.nav{display:flex;gap:6px;overflow:auto;padding-top:8px}.nav button{white-space:nowrap;min-width:max-content}
.login{max-width:520px;margin:8vh auto}.pill{font-size:10px;padding:4px 7px;border-radius:999px;background:#22202a;color:#bcd1ff}
@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}header{padding-top:max(10px,env(safe-area-inset-top))}}
</style></head><body>
<header><div class="wrap"><h1>📅 チャレンジ管理</h1><div class="muted">1日チャレンジ・A/B/C・漢字バスターズ・週間報酬とランキング。</div></div></header>
<div class="wrap">
<div id="loginBox" class="card login"><h2>🔐 教員ログイン</h2><div class="grid"><div><label>メール</label><input id="email" type="email"></div><div><label>パスワード</label><input id="password" type="password" onkeydown="if(event.key==='Enter')login()"></div></div><button class="primary" style="width:100%;margin-top:8px" onclick="login()">ログイン</button><div id="status" class="status">メインゲームと同じFirebaseへ接続します。</div></div>
<div id="appBox" class="hidden">
<div class="card"><div class="nav"><button onclick="showC('daily')">📅 1日チャレンジ</button><button onclick="showC('abc')">A/B/C</button><button onclick="showC('busters')">⚔️ バスターズ</button><button onclick="showC('weekly')">🏆 ランキング</button><button onclick="reloadAll()">🔄</button><button onclick="logout()">ログアウト</button></div></div>
<div id="dailyC"><div class="card"><h2>🧮 今日の計算</h2><label>出題モード</label><select id="mathMode"><option value="mix">ミックス</option><option value="add">足し算</option><option value="sub">引き算</option><option value="mul">掛け算</option></select><button class="primary" style="width:100%;margin-top:7px" onclick="saveMath()">今日の計算設定を保存</button></div>
<div class="card"><h2>📖 今日の漢字</h2><div class="grid"><div><label>学年</label><select id="kanjiGrade"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div><div><label>学期</label><select id="kanjiTerm"><option>1</option><option>2</option><option>3</option></select></div></div><label style="margin-top:8px">問題（1行「漢字=よみ」、複数読みは / 区切り）</label><textarea id="kanjiWords" placeholder="安全=あんぜん&#10;人気=にんき/ひとけ"></textarea><button class="primary" style="width:100%" onclick="saveKanji()">今日の漢字を保存</button></div></div>
<div id="abcC" class="hidden"><div class="card"><h2>🎚 A/B/C 難易度</h2><div id="abcRows"></div><button class="primary" style="width:100%" onclick="saveABC()">A/B/C設定を保存</button></div></div>
<div id="bustersC" class="hidden"><div class="card"><h2>⚔️ 漢字バスターズ</h2><div class="grid"><div><label>制限時間</label><input id="kbTime" type="number" value="60"></div><div><label>落下速度</label><input id="kbFall" type="number" step="0.1" value="1"></div></div><div id="heroRows"></div><button class="primary" style="width:100%" onclick="saveBusters()">バスターズ設定を保存</button></div></div>
<div id="weeklyC" class="hidden"><div class="card"><h2>🏆 今週のトップ報酬</h2><div id="weeklyRewardRows"></div><button class="primary" style="width:100%" onclick="saveWeekly()">今週の報酬を保存</button></div><div class="card"><h2>📊 今週のランキング</h2><div id="boards" class="list"></div></div></div>
</div>
</div><script>

const firebaseConfig={
 apiKey:"AIzaSyBpC_YgEG6-T70HwSlB3__MDI70WNsxqiQ",
 authDomain:"janken-kingdom.firebaseapp.com",
 projectId:"janken-kingdom",
 storageBucket:"janken-kingdom.firebasestorage.app",
 messagingSenderId:"748399805019",
 appId:"1:748399805019:web:b3d6dc75ccf551bef3357e"
};

let app=null,auth=null,db=null;
function qs(id){return document.getElementById(id)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function status(msg,ok=true){const e=qs("status");if(e){e.textContent=msg;e.style.color=ok?"#bcebc9":"#ffb6c2"}}
function initFirebase(){if(app)return;app=firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore()}
async function login(){
 initFirebase();const email=qs("email").value.trim(),pw=qs("password").value;
 if(!email||!pw)return status("メールアドレスとパスワードを入力してください",false);
 try{status("認証中…");const c=await auth.signInWithEmailAndPassword(email,pw);if(!c.user||c.user.isAnonymous)throw Error("teacher");qs("loginBox").classList.add("hidden");qs("appBox").classList.remove("hidden");status("✅ 教員ログイン成功");await afterLogin()}catch(e){console.error(e);status("ログインできません。メール/パスワードを確認してください",false)}
}
async function logout(){try{await auth.signOut()}catch(e){}location.reload()}
function uid(prefix){return prefix+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,8)}
async function cloudSet(col,id,data,merge=false){return db.collection(col).doc(id).set(data,{merge})}
async function cloudDelete(col,id){return db.collection(col).doc(id).delete()}
function normalizeCode(s){return String(s||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"")}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
document.addEventListener("DOMContentLoaded",()=>{initFirebase();auth.onAuthStateChanged(u=>{if(u&&!u.isAnonymous){qs("loginBox").classList.add("hidden");qs("appBox").classList.remove("hidden");afterLogin().catch(console.error)}})})


let cfg={math:{date:"",mode:"mix"},kanji:{date:"",grade:"4",term:"2",words:[]},abc:null,kb:null,weekly:{weeks:{}}},equipment=[],scores=[];
const ABC_DEFAULT={version:1,levels:{A:{enabled:true,label:"低学年",band:"low",math:{mode:"mix",time:75,multiplier:1},kanji:{grade:"2",term:"3",time:180,multiplier:1,words:[]},busters:{grade:"2",term:"3",multiplier:1}},B:{enabled:true,label:"中学年",band:"mid",math:{mode:"mix",time:60,multiplier:1},kanji:{grade:"4",term:"2",time:150,multiplier:1,words:[]},busters:{grade:"4",term:"2",multiplier:1}},C:{enabled:true,label:"高学年",band:"high",math:{mode:"mix",time:60,multiplier:1.2},kanji:{grade:"6",term:"2",time:150,multiplier:1.2,words:[]},busters:{grade:"6",term:"2",multiplier:1.2}}}};
const KB_DEFAULT={timeLimit:60,fallSpeed:1,heroSkills:[{type:"clear_all",gauge:7,maxUses:2,value:0,duration:0},{type:"one_choice",gauge:7,maxUses:2,value:0,duration:5},{type:"coin_multiplier",gauge:7,maxUses:999,value:2,duration:5}]};
async function afterLogin(){await reloadAll()}
function showC(x){for(const k of ["daily","abc","busters","weekly"])qs(k+"C").classList.toggle("hidden",k!==x)}
async function reloadAll(){status("チャレンジ設定を読み込み中…");const ids=["__daily_math_config","__daily_kanji_config","__abc_challenge_config","__kanji_busters_game_config","__weekly_challenge_rewards","__pet_market_v3"];const [docs,eventSnap]=await Promise.all([Promise.all(ids.map(id=>db.collection("packs").doc(id).get())),db.collection("events").get()]);const m=Object.fromEntries(docs.map(s=>[s.id,s.data()||{}]));cfg.math=m["__daily_math_config"].dailyMathConfig||cfg.math;cfg.kanji=m["__daily_kanji_config"].dailyKanjiConfig||cfg.kanji;cfg.abc=m["__abc_challenge_config"].abcChallengeConfig||JSON.parse(JSON.stringify(ABC_DEFAULT));cfg.kb=m["__kanji_busters_game_config"].kbGameConfig||JSON.parse(JSON.stringify(KB_DEFAULT));cfg.weekly=m["__weekly_challenge_rewards"].weeklyRewardSettings||{weeks:{}};equipment=m["__pet_market_v3"].equipmentDefs||[];scores=eventSnap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.internalType==="weekly_score");render();status("✅ 読み込み完了")}
function render(){qs("mathMode").value=cfg.math.mode||"mix";qs("kanjiGrade").value=cfg.kanji.grade||"4";qs("kanjiTerm").value=cfg.kanji.term||"2";qs("kanjiWords").value=(cfg.kanji.words||[]).map(w=>`${w.word}=${(w.readings||[]).join("/")}`).join("\n");renderABC();renderKB();renderWeekly()}
async function saveMath(){const c={date:todayKey(),mode:qs("mathMode").value};await cloudSet("packs","__daily_math_config",{id:"__daily_math_config",isCustom:false,dailyMathConfig:c,updatedAt:Date.now()});cfg.math=c;status("✅ 今日の計算設定を保存しました")}
function parseWords(){return String(qs("kanjiWords").value||"").split(/\n+/).map(x=>x.trim()).filter(Boolean).map(line=>{const [w,r]=line.split("=");return {word:(w||"").trim(),readings:String(r||"").split("/").map(x=>x.trim()).filter(Boolean)}}).filter(x=>x.word&&x.readings.length)}
async function saveKanji(){const words=parseWords();if(words.length<15)return alert("漢字問題は最低15問必要です");const c={date:todayKey(),grade:qs("kanjiGrade").value,term:qs("kanjiTerm").value,words};await cloudSet("packs","__daily_kanji_config",{id:"__daily_kanji_config",isCustom:false,dailyKanjiConfig:c,updatedAt:Date.now()});cfg.kanji=c;status(`✅ 漢字${words.length}問を保存しました`)}
function renderABC(){const root=qs("abcRows");root.innerHTML=["A","B","C"].map(k=>{const x=cfg.abc.levels[k];return `<div class="item"><h3>${k}</h3><div class="grid3"><div><label>有効</label><select id="abcEn${k}"><option value="1">ON</option><option value="0">OFF</option></select></div><div><label>表示名</label><input id="abcLabel${k}" value="${esc(x.label)}"></div><div><label>帯</label><select id="abcBand${k}"><option value="low">低</option><option value="mid">中</option><option value="high">高</option></select></div><div><label>計算時間</label><input id="abcMathTime${k}" type="number" value="${x.math.time}"></div><div><label>計算倍率</label><input id="abcMathMul${k}" type="number" step="0.1" value="${x.math.multiplier}"></div><div><label>漢字時間</label><input id="abcKanjiTime${k}" type="number" value="${x.kanji.time}"></div><div><label>漢字学年</label><input id="abcKanjiGrade${k}" value="${x.kanji.grade}"></div><div><label>漢字学期</label><input id="abcKanjiTerm${k}" value="${x.kanji.term}"></div><div><label>漢字倍率</label><input id="abcKanjiMul${k}" type="number" step="0.1" value="${x.kanji.multiplier}"></div><div><label>バスターズ学年</label><input id="abcBustGrade${k}" value="${x.busters.grade}"></div><div><label>バスターズ倍率</label><input id="abcBustMul${k}" type="number" step="0.1" value="${x.busters.multiplier}"></div></div></div>`}).join("");for(const k of ["A","B","C"]){const x=cfg.abc.levels[k];qs("abcEn"+k).value=x.enabled===false?"0":"1";qs("abcBand"+k).value=x.band||"mid"}}
async function saveABC(){for(const k of ["A","B","C"]){const x=cfg.abc.levels[k];x.enabled=qs("abcEn"+k).value==="1";x.label=qs("abcLabel"+k).value.trim()||k;x.band=qs("abcBand"+k).value;x.math.time=Number(qs("abcMathTime"+k).value)||60;x.math.multiplier=Number(qs("abcMathMul"+k).value)||1;x.kanji.time=Number(qs("abcKanjiTime"+k).value)||150;x.kanji.grade=qs("abcKanjiGrade"+k).value;x.kanji.term=qs("abcKanjiTerm"+k).value;x.kanji.multiplier=Number(qs("abcKanjiMul"+k).value)||1;x.busters.grade=qs("abcBustGrade"+k).value;x.busters.multiplier=Number(qs("abcBustMul"+k).value)||1}await cloudSet("packs","__abc_challenge_config",{id:"__abc_challenge_config",isCustom:false,abcChallengeConfig:cfg.abc,updatedAt:Date.now()});status("✅ A/B/C設定を保存しました")}
function renderKB(){qs("kbTime").value=cfg.kb.timeLimit||60;qs("kbFall").value=cfg.kb.fallSpeed||1;qs("heroRows").innerHTML=[0,1,2].map(i=>{const x=cfg.kb.heroSkills[i]||KB_DEFAULT.heroSkills[i];return `<div class="item"><b>ヒーロー${i+1}</b><div class="grid3"><div><label>スキル</label><select id="skill${i}"><option value="clear_all">一掃</option><option value="one_choice">正解部首だけ</option><option value="coin_multiplier">コイン倍率</option><option value="time_add">時間追加</option><option value="slow_fall">落下低下</option><option value="penalty_guard">ペナルティ軽減</option></select></div><div><label>必要撃破</label><input id="gauge${i}" type="number" value="${x.gauge}"></div><div><label>使用上限</label><input id="uses${i}" type="number" value="${x.maxUses}"></div><div><label>効果値</label><input id="skillVal${i}" type="number" step="0.1" value="${x.value}"></div><div><label>秒数</label><input id="dur${i}" type="number" value="${x.duration}"></div></div></div>`}).join("");for(let i=0;i<3;i++)qs("skill"+i).value=cfg.kb.heroSkills[i]?.type||KB_DEFAULT.heroSkills[i].type}
async function saveBusters(){cfg.kb={timeLimit:Number(qs("kbTime").value)||60,fallSpeed:Number(qs("kbFall").value)||1,heroSkills:[0,1,2].map(i=>({type:qs("skill"+i).value,gauge:Number(qs("gauge"+i).value)||7,maxUses:Number(qs("uses"+i).value)||2,value:Number(qs("skillVal"+i).value)||0,duration:Number(qs("dur"+i).value)||0}))};await cloudSet("packs","__kanji_busters_game_config",{id:"__kanji_busters_game_config",isCustom:false,kbGameConfig:cfg.kb,updatedAt:Date.now()});status("✅ バスターズ設定を保存しました")}
function mondayKey(d=new Date()){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function rewardOptions(){return `<option value="coin">コイン</option><option value="ticket_sr">SR以上券</option><option value="kb_ticket">バスターズ券</option><option value="kb_premium_ticket">プレミアム券</option><option value="pet_equipment">ペット装備</option>`}
function renderWeekly(){const week=mondayKey(),w=cfg.weekly.weeks?.[week]||{},cats=[["math","計算"],["kanji","漢字"],["busters","バスターズ"]];qs("weeklyRewardRows").innerHTML=cats.map(([k,n])=>{const r=w[k]||{type:"coin",amount:300};return `<div class="item"><b>${n}</b><div class="grid"><div><label>報酬</label><select id="rwType${k}" onchange="syncReward('${k}')">${rewardOptions()}</select></div><div><label>個数/コイン</label><input id="rwAmt${k}" type="number" value="${Number(r.amount)||1}"></div></div><div id="rwEqWrap${k}" class="hidden"><label>装備</label><select id="rwEq${k}">${equipment.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join("")}</select></div></div>`}).join("");for(const [k] of cats){const r=w[k]||{type:"coin"};qs("rwType"+k).value=r.type||"coin";if(r.equipmentId)qs("rwEq"+k).value=r.equipmentId;syncReward(k)}renderBoards()}
function syncReward(k){qs("rwEqWrap"+k).classList.toggle("hidden",qs("rwType"+k).value!=="pet_equipment")}
async function saveWeekly(){const week=mondayKey();cfg.weekly.weeks=cfg.weekly.weeks||{};const read=k=>{const type=qs("rwType"+k).value;return {type,amount:type==="pet_equipment"?1:Math.max(1,Number(qs("rwAmt"+k).value)||1),equipmentId:type==="pet_equipment"?qs("rwEq"+k).value:""}};cfg.weekly.weeks[week]={math:read("math"),kanji:read("kanji"),busters:read("busters"),savedAt:Date.now()};await cloudSet("packs","__weekly_challenge_rewards",{id:"__weekly_challenge_rewards",isCustom:false,weeklyRewardSettings:cfg.weekly,updatedAt:Date.now()});status("✅ 今週のトップ報酬を保存しました")}
function renderBoards(){const week=mondayKey(),cats=[["math","計算"],["kanji","漢字"],["busters","バスターズ"]],diffs=["A","B","C"];qs("boards").innerHTML=cats.flatMap(([cat,n])=>diffs.map(d=>{const a=scores.filter(x=>x.week===week&&x.category===cat&&String(x.difficulty||"B")===d).sort((x,y)=>(Number(y.best)||0)-(Number(x.best)||0));const top=a[0];return `<div class="item"><b>${n} ${d}</b><div>${top?`${esc(top.name||"プレイヤー")} / ${Number(top.best)||0}コイン`:"記録なし"}</div></div>`})).join("")}
</script></body></html>
