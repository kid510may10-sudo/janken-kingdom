<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🃏 カード管理</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0a10;--panel:#17131e;--line:#4e415e;--text:#f7f2ff;--muted:#b9aec8;--accent:#8f6cff;--ok:#75d99b;--danger:#ff7b8f}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#130c1e,#09070d);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:30;background:#0b0910e8;backdrop-filter:blur(12px);border-bottom:1px solid #3b3047;padding:10px}
.wrap{width:min(920px,100%);margin:auto;padding:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 9px}h3{font-size:14px;margin:12px 0 6px}.muted{font-size:11px;color:var(--muted);line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label{display:block;font-size:11px;color:#d9cfe5;margin-bottom:4px}input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;background:#0d0b12;color:#fff;border:1px solid #574868;border-radius:11px;padding:10px}
textarea{min-height:90px;resize:vertical}button{border:0;border-radius:11px;padding:10px 12px;font-weight:800;background:#352944;color:#fff}
button.primary{background:linear-gradient(135deg,#7752df,#a565ff)}button.ok{background:#27583c}button.danger{background:#672b38}button:disabled{opacity:.45}
.row{display:flex;gap:7px;flex-wrap:wrap}.row>*{flex:1}.list{display:grid;gap:7px}.item{border:1px solid #463a54;background:#100d15;border-radius:12px;padding:9px}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#2b2237;font-size:10px;color:#d8c9ed}.status{font-size:11px;padding:7px 9px;border-radius:9px;background:#10151d;color:#cce3f5;margin-top:7px}
.hidden{display:none!important}.thumb{width:100%;max-height:220px;object-fit:contain;background:#09070b;border-radius:10px;margin-top:7px}
.nav{display:flex;gap:6px;overflow:auto;padding-top:8px}.nav button{white-space:nowrap;min-width:max-content}
.login{max-width:520px;margin:8vh auto}.pill{font-size:10px;padding:4px 7px;border-radius:999px;background:#22202a;color:#bcd1ff}
@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}header{padding-top:max(10px,env(safe-area-inset-top))}}
</style></head><body>
<header><div class="wrap"><h1>🃏 カード管理</h1><div class="muted">カードだけを軽く編集。保存するとメインゲームへ直接反映。</div></div></header>
<div class="wrap">
<div id="loginBox" class="card login"><h2>🔐 教員ログイン</h2><div class="grid"><div><label>メール</label><input id="email" type="email"></div><div><label>パスワード</label><input id="password" type="password" onkeydown="if(event.key==='Enter')login()"></div></div><button class="primary" style="width:100%;margin-top:8px" onclick="login()">ログイン</button><div id="status" class="status">メインゲームと同じFirebaseへ接続します。</div></div>
<div id="appBox" class="hidden">
<div class="card"><div class="row"><button class="primary" onclick="newCard()">＋ 新規カード</button><button onclick="loadCards()">🔄 再読込</button><button onclick="logout()">ログアウト</button></div></div>
<div class="card"><h2>🃏 カード作成・編集</h2>
<input id="cardId" type="hidden">
<div class="grid3">
<div><label>カード名</label><input id="name"></div>
<div><label>レア度</label><select id="rarity"><option>N</option><option>R</option><option>SR</option><option>UR</option><option>AR</option><option>P</option></select></div>
<div><label>カード種類</label><select id="cardType" onchange="syncCardType()"><option value="normal">通常</option><option value="special">必殺</option><option value="evolution">進化</option></select></div>
<div><label>じゃんけん</label><select id="hand"><option value="rock">✊ グー</option><option value="scissors">✌️ チョキ</option><option value="paper">✋ パー</option><option value="none">なし</option></select></div>
<div><label>種族</label><select id="attr"></select></div>
<div><label>効果値</label><input id="value" type="number" step="1" value="1"></div>
</div>
<div style="margin-top:8px"><label>効果</label><select id="kind"></select></div>
<div style="margin-top:8px"><label>説明</label><textarea id="desc"></textarea></div>
<div class="grid" style="margin-top:8px">
<div><label>画像URL / GitHubパス</label><input id="art" oninput="previewArt()"><input id="artFile" type="file" accept="image/*" style="margin-top:5px" onchange="pickArt(this)"><img id="artPreview" class="thumb hidden"></div>
<div><label>プレゼントコード</label><div class="row"><input id="redeem"><button onclick="randomCode()">🎲 7桁</button></div><div class="muted">自由入力も可能。ランダムは使用済みコードを確認します。</div></div>
</div>
<div class="row" style="margin-top:10px"><button class="primary" onclick="saveCard()">💾 保存</button><button class="danger" id="deleteBtn" onclick="deleteCard()">削除</button></div>
<div id="editStatus" class="status">新規カードを作成できます。</div></div>
<div class="card"><h2>📚 保存済みカード</h2><input id="search" placeholder="名前・コードで検索" oninput="renderCards()"><div id="cardList" class="list" style="margin-top:8px"></div></div>
</div>
</div><script>

const firebaseConfig={
 apiKey:"AIzaSyBpC_YgEG6-T70HwSlB3__MDI70WNsxqiQ",
 authDomain:"janken-kingdom.firebaseapp.com",
 projectId:"janken-kingdom",
 storageBucket:"janken-kingdom.firebasestorage.app",
 messagingSenderId:"748399805019",
 appId:"1:748399805019:web:b3d6dc75ccf551bef3357e"
};

let app=null,auth=null,db=null;
function qs(id){return document.getElementById(id)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function status(msg,ok=true){const e=qs("status");if(e){e.textContent=msg;e.style.color=ok?"#bcebc9":"#ffb6c2"}}
function initFirebase(){if(app)return;app=firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore()}
async function login(){
 initFirebase();const email=qs("email").value.trim(),pw=qs("password").value;
 if(!email||!pw)return status("メールアドレスとパスワードを入力してください",false);
 try{status("認証中…");const c=await auth.signInWithEmailAndPassword(email,pw);if(!c.user||c.user.isAnonymous)throw Error("teacher");qs("loginBox").classList.add("hidden");qs("appBox").classList.remove("hidden");status("✅ 教員ログイン成功");await afterLogin()}catch(e){console.error(e);status("ログインできません。メール/パスワードを確認してください",false)}
}
async function logout(){try{await auth.signOut()}catch(e){}location.reload()}
function uid(prefix){return prefix+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,8)}
async function cloudSet(col,id,data,merge=false){return db.collection(col).doc(id).set(data,{merge})}
async function cloudDelete(col,id){return db.collection(col).doc(id).delete()}
function normalizeCode(s){return String(s||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"")}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
document.addEventListener("DOMContentLoaded",()=>{initFirebase();auth.onAuthStateChanged(u=>{if(u&&!u.isAnonymous){qs("loginBox").classList.add("hidden");qs("appBox").classList.remove("hidden");afterLogin().catch(console.error)}})})


const ATTRS={none:"無属性",vampire:"バンパイア",dragon:"ドラゴン",beast:"ビースト",elf:"エルフ",undead:"アンデッド",machine:"マシン",spirit:"スピリット",knight:"ナイト",mage:"メイジ",christmas:"クリスマス",dog:"ドッグ",god:"神",animal:"アニマル",yoma:"妖魔"};
const EFFECTS=[
 ["normal","効果なし"],["win_plus","勝利ボーナス"],["tie_plus","あいこボーナス"],["lose_plus","敗北ボーナス"],
 ["op_minus_win","勝利時ポイント破壊"],["op_minus_any","相手ポイント減少"],["drain_win","ポイント吸収"],
 ["cancel","相手効果を無効"],["seal_next","次ターン効果封印"],["protect","妨害耐性"],["comeback","劣勢ボーナス"],
 ["lead_bonus","リードボーナス"],["first_round","序盤ボーナス"],["late_round","終盤ボーナス"],
 ["streak","連勝ボーナス"],["revenge","リベンジ"],["same_hand_combo","同じ手コンボ"],["different_hand_combo","違う手コンボ"],
 ["attr_win_bonus","種族勝利ボーナス"],["counter_rock","グー対策"],["counter_scissors","チョキ対策"],["counter_paper","パー対策"],
 ["random_plus","ランダム加点"],["trash_bonus","トラッシュボーナス"],["reveal_on_win","勝ったら手札を見る"],
 ["reveal_two_win","勝ったら2枚見る"],["tie_to_win","あいこを勝ち扱い"],["loss_cancel","敗北キャンセル"],
 ["special_add_incarnation","必殺：化身招来"],["special_attr_double","必殺：種族ブースト"],["special_no_minus","必殺：減点封鎖"],
 ["special_both_effects_off","必殺：完全沈黙"],["special_recover_used","必殺：再起"]
];
let cards=[],editingOriginal=null,artData="";
async function afterLogin(){buildOptions();await loadCards()}
function buildOptions(){
 qs("attr").innerHTML=Object.entries(ATTRS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
 qs("kind").innerHTML=EFFECTS.map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
 newCard();
}
async function loadCards(){status("カードを読み込み中…");const s=await db.collection("cards").get();cards=s.docs.map(d=>({id:d.id,...d.data()}));renderCards();status(`✅ ${cards.length}枚を読み込みました`)}
function renderCards(){const q=String(qs("search").value||"").toLowerCase();const a=cards.filter(c=>!q||String(c.name||"").toLowerCase().includes(q)||String(c.redeemCode||"").toLowerCase().includes(q));qs("cardList").innerHTML=a.map(c=>`<div class="item"><b>${esc(c.name||c.id)}</b> <span class="badge">${esc(c.rarity||"N")}</span> <span class="badge">${esc(c.cardType||"normal")}</span><div class="muted">${esc(c.desc||"")}</div>${c.redeemCode?`<div class="muted">🎁 ${esc(c.redeemCode)}</div>`:""}<button style="width:100%;margin-top:6px" onclick="editCard('${c.id}')">編集</button></div>`).join("")||'<div class="muted">カードなし</div>'}
function newCard(){editingOriginal=null;qs("cardId").value="";qs("name").value="";qs("rarity").value="N";qs("cardType").value="normal";qs("hand").value="rock";qs("attr").value="none";qs("kind").value="normal";qs("value").value=1;qs("desc").value="";qs("art").value="";qs("redeem").value="";artData="";previewArt();qs("deleteBtn").disabled=true;qs("editStatus").textContent="新規カード";syncCardType()}
function editCard(id){const c=cards.find(x=>x.id===id);if(!c)return;editingOriginal=JSON.parse(JSON.stringify(c));qs("cardId").value=c.id;qs("name").value=c.name||"";qs("rarity").value=c.rarity||"N";qs("cardType").value=c.cardType||"normal";qs("hand").value=c.hand||"rock";qs("attr").value=c.attr||"none";qs("kind").value=c.kind||c.effects?.[0]?.kind||"normal";qs("value").value=Number(c.value??c.effects?.[0]?.value??1);qs("desc").value=c.desc||"";qs("art").value=c.customArt||"";qs("redeem").value=c.redeemCode||"";artData=c.customArt||"";previewArt();qs("deleteBtn").disabled=false;qs("editStatus").textContent=`編集中：${c.name}`;syncCardType();scrollTo({top:0,behavior:"smooth"})}
function syncCardType(){if(qs("cardType").value==="special"){qs("hand").value="none"}}
function previewArt(){const p=qs("artPreview"),src=artData||qs("art").value.trim();if(src){p.src=src;p.classList.remove("hidden")}else p.classList.add("hidden")}
async function pickArt(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=async()=>{artData=await compressImage(String(r.result||""));qs("art").value=artData;previewArt();input.value=""};r.readAsDataURL(f)}
async function compressImage(data){try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=data});const s=Math.min(1,720/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.72)}catch(e){return data}}
async function randomCode(){const used=new Set(cards.map(c=>normalizeCode(c.redeemCode)).filter(Boolean));try{const s=await db.collection("packs").doc("__card_redeem_code_registry_v1").get();for(const x of (s.data()?.reservedCodes||[]))used.add(normalizeCode(x))}catch(e){};for(let n=0;n<100;n++){const a="ABCDEFGHIJKLMNOPQRSTUVWXYZ",b="0123456789",all=a+b;let code="";const z=new Uint32Array(7);crypto.getRandomValues(z);for(let i=0;i<7;i++)code+=all[z[i]%all.length];if(!/[A-Z]/.test(code)||!/[0-9]/.test(code)||used.has(code))continue;await db.runTransaction(async tx=>{const ref=db.collection("packs").doc("__card_redeem_code_registry_v1"),s=await tx.get(ref),arr=s.data()?.reservedCodes||[];if(arr.map(normalizeCode).includes(code))throw Error("dup");tx.set(ref,{id:"__card_redeem_code_registry_v1",isCustom:false,reservedCodes:[...arr,code],updatedAt:Date.now()},{merge:true})});qs("redeem").value=code;qs("editStatus").textContent=`未使用コード ${code} を設定しました`;return}alert("コード生成に失敗しました")}
async function saveCard(){const name=qs("name").value.trim();if(!name)return alert("カード名を入力してください");const redeem=normalizeCode(qs("redeem").value);if(redeem){const dup=cards.find(c=>c.id!==qs("cardId").value&&normalizeCode(c.redeemCode)===redeem);if(dup)return alert(`配布コードは「${dup.name}」で使用済みです`)}const id=qs("cardId").value||uid("custom"),kind=qs("kind").value,val=Number(qs("value").value)||0;const base=editingOriginal||{};const card={...base,id,name,rarity:qs("rarity").value,cardType:qs("cardType").value,hand:qs("cardType").value==="special"?"none":qs("hand").value,attr:qs("attr").value,kind,value:val,effects:[{kind,value:val,effectConfig:base.effects?.[0]?.effectConfig||{}}],redeemCode:redeem,desc:qs("desc").value.trim(),custom:true,customArt:artData||qs("art").value.trim(),emoji:base.emoji||"👾"};await cloudSet("cards",id,card,false);qs("editStatus").textContent="✅ 保存しました";await loadCards();editCard(id)}
async function deleteCard(){const id=qs("cardId").value;if(!id||!confirm("このカードを削除しますか？"))return;await cloudDelete("cards",id);newCard();await loadCards()}
</script></body></html>
