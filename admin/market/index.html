<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🏪 マーケット管理</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0a10;--panel:#17131e;--line:#4e415e;--text:#f7f2ff;--muted:#b9aec8;--accent:#8f6cff;--ok:#75d99b;--danger:#ff7b8f}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#130c1e,#09070d);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:30;background:#0b0910e8;backdrop-filter:blur(12px);border-bottom:1px solid #3b3047;padding:10px}
.wrap{width:min(920px,100%);margin:auto;padding:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 9px}h3{font-size:14px;margin:12px 0 6px}.muted{font-size:11px;color:var(--muted);line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label{display:block;font-size:11px;color:#d9cfe5;margin-bottom:4px}input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;background:#0d0b12;color:#fff;border:1px solid #574868;border-radius:11px;padding:10px}
textarea{min-height:90px;resize:vertical}button{border:0;border-radius:11px;padding:10px 12px;font-weight:800;background:#352944;color:#fff}
button.primary{background:linear-gradient(135deg,#7752df,#a565ff)}button.ok{background:#27583c}button.danger{background:#672b38}button:disabled{opacity:.45}
.row{display:flex;gap:7px;flex-wrap:wrap}.row>*{flex:1}.list{display:grid;gap:7px}.item{border:1px solid #463a54;background:#100d15;border-radius:12px;padding:9px}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#2b2237;font-size:10px;color:#d8c9ed}.status{font-size:11px;padding:7px 9px;border-radius:9px;background:#10151d;color:#cce3f5;margin-top:7px}
.hidden{display:none!important}.thumb{width:100%;max-height:220px;object-fit:contain;background:#09070b;border-radius:10px;margin-top:7px}
.nav{display:flex;gap:6px;overflow:auto;padding-top:8px}.nav button{white-space:nowrap;min-width:max-content}
.login{max-width:520px;margin:8vh auto}.pill{font-size:10px;padding:4px 7px;border-radius:999px;background:#22202a;color:#bcd1ff}
@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}header{padding-top:max(10px,env(safe-area-inset-top))}}
</style></head><body>
<header><div class="wrap"><h1>🏪 マーケット管理</h1><div class="muted">カード・卵・装備などを他の管理ページから選んで、先生ショップへ出品できます。</div></div></header>
<div class="wrap">
<div id="loginBox" class="card login"><h2>🔐 教員ログイン</h2><div class="grid"><div><label>メール</label><input id="email" type="email"></div><div><label>パスワード</label><input id="password" type="password" onkeydown="if(event.key==='Enter')login()"></div></div><button class="primary" style="width:100%;margin-top:8px" onclick="login()">ログイン</button><div id="status" class="status">メインゲームと同じFirebaseへ接続します。</div></div>
<div id="appBox" class="hidden">
<div class="card"><div class="row"><button onclick="refreshMarketCatalog()">🔄 商品候補を更新</button><button onclick="logout()">ログアウト</button></div></div>
<div class="card"><h2>🏪 先生ショップの商品作成・編集</h2><div class="muted" style="margin-bottom:9px">カード管理で作ったカード・ペット管理で作った卵や装備を選んで販売できます。追加した商品が見えないときは「商品候補を更新」を押してください。</div><input id="shopId" type="hidden"><div class="grid3"><div><label>商品種別</label><select id="shopKind" onchange="qs('shopSearch').value='';syncShopKind()"><option value="egg">🥚 卵</option><option value="pet_equipment">🎒 ペット装備</option><option value="card">🃏 カード</option><option value="ticket_sr">🎟 SR以上券</option><option value="ticket_sr_under">🎫 SR以下券</option><option value="limit_diamond">💎 ダイヤモンド</option><option value="rp_crystal">🔷 RPクリスタル</option><option value="pet_consumable">🎁 ペット消費アイテム</option><option value="pet_gem">💎 特定ペットの宝石</option><option value="choice_lake">🌊 選択の湖</option><option value="stat_reset">⛲ 選択の泉</option></select></div><div><label>商品名・IDで検索</label><input id="shopSearch" placeholder="例：ドラゴン、卵、剣…" oninput="syncShopKind(true)" style="margin-bottom:6px"><label>登録する商品</label><select id="shopItem" onchange="onShopItemChange()"></select><div id="shopItemInfo" class="muted" style="margin-top:5px"></div><input id="shopManual" type="hidden"></div><div><label>表示名</label><input id="shopName"></div><div><label>価格</label><input id="shopPrice" type="number" min="100" step="10" value="300"></div><div><label>在庫/児童ごとの上限</label><input id="shopStock" type="number" min="0" value="10"></div><div><label>個数</label><input id="shopQty" type="number" min="1" value="1"></div></div><div class="row" style="margin-top:8px"><button class="primary" onclick="saveShop()">💾 保存</button><button onclick="newShop()">新規</button><button class="danger" onclick="deleteShop()">削除</button></div></div>
<div class="card"><h2>公式商品一覧</h2><div id="catalogStatus" class="muted" style="margin-bottom:8px"></div><div id="officialList" class="list"></div></div>
<div class="card"><h2>👦 児童フリマ出品</h2><div class="muted">現在の active 出品を確認できます。問題がある出品は管理者側から終了できます。</div><div id="fleaList" class="list" style="margin-top:8px"></div></div>
</div>
</div><script>

const firebaseConfig={
 apiKey:"AIzaSyBpC_YgEG6-T70HwSlB3__MDI70WNsxqiQ",
 authDomain:"janken-kingdom.firebaseapp.com",
 projectId:"janken-kingdom",
 storageBucket:"janken-kingdom.firebasestorage.app",
 messagingSenderId:"748399805019",
 appId:"1:748399805019:web:b3d6dc75ccf551bef3357e"
};

let app=null,auth=null,db=null;
function qs(id){return document.getElementById(id)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function status(msg,ok=true){const e=qs("status");if(e){e.textContent=msg;e.style.color=ok?"#bcebc9":"#ffb6c2"}}
function initFirebase(){if(app)return;app=firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore()}
async function login(){
 initFirebase();const email=qs("email").value.trim(),pw=qs("password").value;
 if(!email||!pw)return status("メールアドレスとパスワードを入力してください",false);
 try{status("認証中…");const c=await auth.signInWithEmailAndPassword(email,pw);if(!c.user||c.user.isAnonymous)throw Error("teacher");qs("loginBox").classList.add("hidden");qs("appBox").classList.remove("hidden");status("✅ 教員ログイン成功");await afterLogin()}catch(e){console.error(e);status("ログインできません。メール/パスワードを確認してください",false)}
}
async function logout(){try{await auth.signOut()}catch(e){}location.reload()}
function uid(prefix){return prefix+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,8)}
async function cloudSet(col,id,data,merge=false){return db.collection(col).doc(id).set(data,{merge})}
async function cloudDelete(col,id){return db.collection(col).doc(id).delete()}
function normalizeCode(s){return String(s||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"")}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
document.addEventListener("DOMContentLoaded",()=>{initFirebase();auth.onAuthStateChanged(u=>{if(u&&!u.isAnonymous){qs("loginBox").classList.add("hidden");qs("appBox").classList.remove("hidden");afterLogin().catch(console.error)}})})


const CFG="__pet_market_v3";let cfg={eggs:[],characters:[],equipmentDefs:[],official:[]},cards=[],fleas=[];
const PET_ITEMS={miracle_blanket:"🧣 奇跡の毛布",study_machine:"🤖 一緒に学ぼうマシン",pet_food_luxury:"🍖 高級メニュー",pet_food_meal:"🍚 ごはんメニュー",pet_food_snack:"🦴 おやつメニュー"};
const FIXED_ITEMS={ticket_sr:"🎟 SR以上確定チケット",ticket_sr_under:"🎫 SR以下確定チケット",limit_diamond:"💎 ダイヤモンド",rp_crystal:"🔷 RPクリスタル",choice_lake:"🌊 選択の湖",stat_reset:"⛲ 選択の泉"};
const NEEDS_ID=new Set(["egg","pet_equipment","card","pet_consumable","pet_gem"]);
let loadingMarket=false;
async function afterLogin(){await loadMarket()}
async function loadMarket(){
 if(loadingMarket)return;
 loadingMarket=true;status("カード・卵・装備・ショップを読込中…");
 try{
  const [p,c,e]=await Promise.all([
   db.collection("packs").doc(CFG).get(),
   db.collection("cards").get(),
   db.collection("events").get()
  ]);
  cfg={eggs:[],characters:[],equipmentDefs:[],official:[],...(p.data()||{})};
  for(const k of ["eggs","characters","equipmentDefs","official"])if(!Array.isArray(cfg[k]))cfg[k]=[];
  cards=c.docs.map(d=>({id:d.id,...d.data()}));
  fleas=e.docs.map(d=>({docId:d.id,...d.data()})).filter(x=>(x.internalType==="weekly_score"||String(x.docId||"").startsWith("__weekly_score_market_"))&&x.week==="market"&&x.difficulty==="MARKET"&&x.market?.status==="active");
  renderOfficial();renderFlea();syncShopKind();
  qs("catalogStatus").textContent=`🃏 カード ${cards.length}種類 ／ 🥚 卵 ${cfg.eggs.length}種類 ／ 🎒 装備 ${cfg.equipmentDefs.length}種類 ／ 🐾 ペット ${cfg.characters.length}種類`;
  status(`✅ 商品候補を更新しました。公式${cfg.official.length}件 / 児童出品${fleas.length}件`);
 }catch(e){console.error(e);status("❌ データ取得に失敗しました。通信と教員権限を確認してください。",false)}
 finally{loadingMarket=false}
}
async function refreshMarketCatalog(){
 const id=qs("shopId").value,kind=qs("shopKind").value,item=qs("shopItem").value;
 const state={name:qs("shopName").value,price:qs("shopPrice").value,stock:qs("shopStock").value,qty:qs("shopQty").value,search:qs("shopSearch").value};
 await loadMarket();
 qs("shopId").value=id;qs("shopKind").value=kind;qs("shopSearch").value=state.search;
 syncShopKind(true,item);
 qs("shopName").value=state.name;qs("shopPrice").value=state.price;qs("shopStock").value=state.stock;qs("shopQty").value=state.qty;
}
function newShop(){
 qs("shopId").value="";qs("shopKind").value="egg";qs("shopName").value="";
 qs("shopPrice").value=300;qs("shopStock").value=10;qs("shopQty").value=1;
 qs("shopManual").value="";qs("shopSearch").value="";syncShopKind();onShopItemChange();
}
function choices(kind){
 if(kind==="egg")return cfg.eggs.map(x=>[String(x.id),`🥚 ${x.name||x.id}`]);
 if(kind==="pet_equipment")return cfg.equipmentDefs.map(x=>[String(x.id),`🎒 ${x.name||x.id}`]);
 if(kind==="card")return cards.map(x=>[String(x.id),`🃏 ${x.rarity||"N"}｜${x.name||x.id}`]);
 if(kind==="pet_consumable")return Object.entries(PET_ITEMS);
 if(kind==="pet_gem")return cfg.characters.map(x=>[String(x.id),`💎 ${x.name||x.id}の宝石`]);
 return [["",FIXED_ITEMS[kind]||"商品"]];
}
function syncShopKind(searchOnly=false,preferred=null){
 const kind=qs("shopKind").value,select=qs("shopItem"),old=preferred===null?select.value:String(preferred);
 const filter=qs("shopSearch").value.trim().toLocaleLowerCase();
 const all=choices(kind),found=all.filter(([id,name])=>`${id} ${name}`.toLocaleLowerCase().includes(filter));
 select.innerHTML="";
 if(NEEDS_ID.has(kind)){
  const placeholder=document.createElement("option");placeholder.value="";placeholder.textContent=all.length?(found.length?"商品を選択してください":"一致する商品がありません"):"他の管理ページで商品を作成してください";
  select.appendChild(placeholder);
 }
 for(const [id,name] of found){
  const o=document.createElement("option");o.value=id;o.textContent=name;select.appendChild(o);
 }
 if(found.some(([id])=>id===old))select.value=old;
 else if(NEEDS_ID.has(kind))select.value="";
 else select.value="";

 onShopItemChange();
}
function onShopItemChange(){
 const kind=qs("shopKind").value,id=qs("shopItem").value;
 const found=choices(kind).find(([key])=>key===id);
 const label=found?.[1]||FIXED_ITEMS[kind]||"";
 qs("shopItemInfo").textContent=NEEDS_ID.has(kind)?(found?`選択中：${label}（ID: ${id}）`:"商品を選択してください。候補がない場合は他の管理ページで先に作成してください。"):`選択中：${label}`;
 if(!qs("shopId").value&&label)qs("shopName").value=label;
}
function renderOfficial(){
 const a=cfg.official||[];
 qs("officialList").innerHTML=a.map(o=>`<div class="item"><b>${esc(o.name||o.kind)}</b> <span class="badge">${esc(o.kind)}</span><div class="muted">🪙${Number(o.price)||0} / 購入上限 ${Number(o.stock)||0} / 個数 ${Number(o.qty)||1}${o.itemId?` / ID ${esc(o.itemId)}`:""}</div><button style="width:100%;margin-top:5px" onclick="editShop('${esc(o.id)}')">編集</button></div>`).join("")||'<div class="muted">公式商品なし</div>';
}
function editShop(id){
 const o=(cfg.official||[]).find(x=>String(x.id)===String(id));if(!o)return;
 qs("shopId").value=String(id);qs("shopKind").value=o.kind||"egg";
 qs("shopSearch").value="";
 const item=String(o.kind==="pet_consumable"?o.petItemKind||"":o.itemId||"");
 syncShopKind(false,item);
 qs("shopManual").value=item;
 if(NEEDS_ID.has(o.kind)&&item&&!choices(o.kind).some(([k])=>k===item)){
  const opt=document.createElement("option");opt.value=item;opt.textContent=`⚠️ 元データが見つかりません（${item}）`;qs("shopItem").appendChild(opt);qs("shopItem").value=item;
  qs("shopItemInfo").textContent="⚠️ 他ページで削除された可能性があります。別の商品を選んで保存してください。";
 }
 qs("shopName").value=o.name||"";qs("shopPrice").value=Number(o.price)||300;
 qs("shopStock").value=Number.isFinite(Number(o.stock))?Number(o.stock):0;qs("shopQty").value=Math.max(1,Number(o.qty)||1);
 window.scrollTo({top:0,behavior:"smooth"});
}
async function updateOfficial(mutator){
 const ref=db.collection("packs").doc(CFG);
 const result=await db.runTransaction(async tx=>{
  const snap=await tx.get(ref),official=Array.isArray(snap.data()?.official)?snap.data().official.slice():[];
  const updated=mutator(official);
  tx.set(ref,{official:updated,updatedAt:Date.now()},{merge:true});
  return updated;
 });
 cfg.official=result;renderOfficial();
}
async function saveShop(){
 const price=Math.floor(Number(qs("shopPrice").value)||0);
 if(price<100||price%10!==0)return alert("価格は100コイン以上・10コイン単位です");
 const id=qs("shopId").value||uid("shop"),kind=qs("shopKind").value;
 const item=qs("shopItem").value;
 if(NEEDS_ID.has(kind)&&(!item||!choices(kind).some(([k])=>k===item)))return alert("他の管理ページで作成した有効な商品を選択してください。");
 const old=(cfg.official||[]).find(x=>String(x.id)===id)||{};
 const name=qs("shopName").value.trim()||choices(kind).find(([k])=>k===item)?.[1]||FIXED_ITEMS[kind]||kind;
 const o={...old,id,kind,name,price,stock:Math.max(0,Math.floor(Number(qs("shopStock").value)||0)),qty:Math.max(1,Math.floor(Number(qs("shopQty").value)||1))};
 if(NEEDS_ID.has(kind)){
  if(kind==="pet_consumable"){o.petItemKind=item;delete o.itemId}
  else{o.itemId=item;delete o.petItemKind}
 }else{delete o.itemId;delete o.petItemKind}
 try{
  await updateOfficial(arr=>{const i=arr.findIndex(x=>String(x.id)===id);if(i>=0)arr[i]=o;else arr.push(o);return arr});
  qs("shopId").value=id;qs("shopItemInfo").textContent=`✅ ${name} を先生ショップに保存しました`;
  status(`✅ ${name} を保存しました`);
 }catch(e){console.error(e);status("❌ 保存に失敗しました。通信・権限を確認してください。",false)}
}
async function deleteShop(){
 const id=qs("shopId").value;if(!id||!confirm("公式商品を削除しますか？"))return;
 try{await updateOfficial(arr=>arr.filter(x=>String(x.id)!==id));newShop();status("✅ 公式商品を削除しました")}
 catch(e){console.error(e);status("❌ 削除できませんでした",false)}
}
function fleaLabel(x){const i=x.market?.item||{};return i.name||i.cardName||i.petName||i.equipmentName||i.type||"商品"}
function renderFlea(){qs("fleaList").innerHTML=fleas.map(x=>`<div class="item"><b>${esc(fleaLabel(x))}</b> <span class="badge">${Number(x.market?.price)||0}コイン</span><div class="muted">出品者：${esc(x.market?.sellerName||x.name||"")}</div><button class="danger" style="width:100%;margin-top:5px" onclick="closeFlea('${x.docId}')">管理者として出品終了</button></div>`).join("")||'<div class="muted">現在の児童出品なし</div>'}
async function closeFlea(docId){if(!confirm("この出品を終了しますか？"))return;await db.collection("events").doc(docId).set({market:{status:"cancelled",updatedAt:Date.now()}},{merge:true});await loadMarket()}
</script></body></html>
