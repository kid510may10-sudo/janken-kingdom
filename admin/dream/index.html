<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夢の効果作成 | じゃんけんキングダム</title><style>body{font-family:system-ui,sans-serif;background:#10182b;color:#f1f5ff;margin:0;padding:18px}main{max-width:740px;margin:auto}.panel{background:#1b2943;border:1px solid #40577b;border-radius:16px;padding:17px;margin:12px 0}label{display:block;margin:12px 0 4px}input,select,button{font:inherit;border-radius:9px;padding:11px;box-sizing:border-box}input,select{width:100%;background:#0d1830;color:white;border:1px solid #587099}button{background:#527de4;color:white;border:0;font-weight:bold;cursor:pointer;margin:8px 6px 8px 0}button.secondary{background:#354767}a{color:#9cd8ff}.fx{padding:10px;border:1px solid #4a638b;border-radius:10px;margin:10px 0}.hint{color:#bdcbe3;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>🌈 夢の自動効果作成</h1><p class="hint">このページはカードの効果案だけを作ります。Firebase・ゲーム本体を読み込まない軽量設計です。完成後はカード管理で確認して保存します。</p><section class="panel"><div class="grid"><div><label>カード名（任意）</label><input id="name" placeholder="例：深淵の盾使い"></div><div><label>戦闘タイプ</label><select id="type"><option value="attack">⚔️ アタック型</option><option value="defense">🛡️ 防御型</option><option value="special">🌀 特殊型</option><option value="support">💚 サポート型</option></select></div><div><label>戦い方</label><select id="style"><option value="steady">安定型</option><option value="risky">逆転型</option><option value="shield">シールド活用型</option><option value="random">ランダム型</option></select></div><div><label>効果の数</label><select id="count"><option>1</option><option>2</option><option selected>3</option></select></div></div><label>効果の説明・イメージ（任意）</label><input id="desc" placeholder="例：シールドを使って相手を妨害"><button onclick="generate()">✨ 効果を自動生成</button></section><section class="panel"><h2>生成した効果</h2><div id="results" class="hint">タイプを選んで生成してください。</div><button onclick="transfer()">🃏 カード管理へ効果を渡す</button><p id="msg" class="hint">カード管理側で新規カードに取り込み、保存するとゲームで使えるようになります。</p></section><a href="../cards/index.html">← カード管理へ戻る</a></main><script>
const options=[['shield_gain','🛡️ シールド獲得'],['shield_parasite','🦠 シールド寄生'],['shield_enemy_cost','🔮 敵シールド消費'],['shield_bomb','💣 シールド爆弾'],['win_plus','勝利ボーナス'],['tie_plus','あいこボーナス'],['lose_plus','敗北ボーナス'],['op_minus_win','勝利時ポイント破壊'],['op_minus_any','相手ポイント減少'],['drain_win','ポイント吸収'],['cancel','相手効果無効'],['seal_next','次ターン効果封印'],['protect','妨害耐性'],['comeback','劣勢ボーナス'],['random_plus','ランダム加点'],['reveal_on_win','勝利時公開']];
const pools={attack:['win_plus','op_minus_win','op_minus_any','drain_win','random_plus'],defense:['shield_gain','protect','comeback','cancel'],special:['shield_parasite','shield_bomb','shield_enemy_cost','cancel','seal_next'],support:['shield_gain','tie_plus','reveal_on_win','lose_plus']};
let effects=[];const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function generate(){let p=[...pools[$('type').value]];let style=$('style').value;if(style==='shield')p=['shield_gain','shield_parasite','shield_bomb','shield_enemy_cost',...p];if(style==='risky')p=['comeback','lose_plus','op_minus_win',...p];effects=[];for(let i=0;i<Number($('count').value);i++){let a=[...new Set(p)].filter(k=>!effects.some(e=>e.kind===k));if(!a.length)break;let kind=a[Math.floor(Math.random()*a.length)];effects.push({kind,value:kind==='shield_gain'?1:3,shieldCost:0,effectConfig:kind==='shield_parasite'?{chance:35}:kind==='shield_bomb'?{damage:3}:kind==='shield_enemy_cost'?{enemyCost:1,damage:3}:{},activation:{conditions:style==='risky'?[{type:'behind_points',points:3,cardId:''}]:[],negatedOnly:false}})}render()}
function render(){$('results').innerHTML=effects.map((f,i)=>`<div class="fx"><b>効果 ${i+1}</b><label>効果の種類</label><select onchange="effects[${i}].kind=this.value;render()">${options.map(([k,n])=>`<option value="${k}" ${f.kind===k?'selected':''}>${n}</option>`).join('')}</select><div class="grid"><div><label>効果値</label><input type="number" value="${f.value}" onchange="effects[${i}].value=Number(this.value)||0"></div><div><label>自分のシールド消費数</label><input type="number" min="0" max="5" value="${f.shieldCost}" onchange="effects[${i}].shieldCost=Math.max(0,Math.min(5,Number(this.value)||0))"></div></div>${f.kind==='shield_parasite'?`<label>寄生増殖確率（%）</label><input type="number" min="0" max="100" value="${f.effectConfig.chance??35}" onchange="effects[${i}].effectConfig.chance=Number(this.value)||0">`:''}${f.kind==='shield_bomb'?`<label>爆弾の減点</label><input type="number" value="${f.effectConfig.damage??3}" onchange="effects[${i}].effectConfig.damage=Number(this.value)||0">`:''}${f.kind==='shield_enemy_cost'?`<label>敵シールド消費数</label><input type="number" min="1" max="5" value="${f.effectConfig.enemyCost??1}" onchange="effects[${i}].effectConfig.enemyCost=Number(this.value)||1"><label>成功時の減点</label><input type="number" value="${f.effectConfig.damage??3}" onchange="effects[${i}].effectConfig.damage=Number(this.value)||0">`:''}</div>`).join('')||'まだ生成されていません'}
function transfer(){if(!effects.length){$('msg').textContent='先に効果を生成してください';return}try{sessionStorage.setItem('jk_dream_effect_draft_v1',JSON.stringify({name:$('name').value,desc:$('desc').value,effects}));location.href='../cards/index.html'}catch(e){$('msg').textContent='受け渡しに失敗しました。ブラウザのプライベートモードや保存設定を確認してください。'}}
</script></body></html>
