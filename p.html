<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎁 プレゼント管理</title><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#302049,#100c1e);color:#fff;font:16px system-ui;min-height:100vh}main{max-width:760px;padding:20px;margin:auto}.box{border:1px solid #6f5c8f;background:#251b35;padding:20px;border-radius:18px;margin:16px 0}input,select,textarea{display:block;width:100%;padding:12px;background:#130e20;border:1px solid #8d77b2;color:white;border-radius:9px;font:inherit;margin-top:6px}label{display:block;margin:12px 0;font-weight:700}button{border:0;border-radius:10px;background:#b897ff;color:#1c102f;padding:13px;font-weight:800;font:inherit;cursor:pointer;margin:5px}button:disabled{opacity:.5}.hidden{display:none}.muted{color:#d0bddc;font-size:13px;line-height:1.6}.notice{padding:12px;border-left:4px solid #ffca74;background:#403047}.entry{border-bottom:1px solid #574666;padding:10px 0;overflow-wrap:anywhere}#status{white-space:pre-wrap;color:#ffe399}a{color:#ddcaff}</style></head><body><main><a href="../../index.html">← 管理メニュー</a><h1>🎁 プレゼント管理</h1><p class="muted">じゃんけんキングダム 教員専用</p><section id="loginBox" class="box"><h2>🔐 教員ログイン</h2><label>メールアドレス<input id="email" type="email"></label><label>パスワード<input id="password" type="password"></label><button id="login">ログイン</button></section><div id="mainBox" class="hidden"><p id="who"></p><button id="logout">ログアウト</button><section class="box"><h2>🎀 プレゼントを作る</h2><label>種類<select id="kind"><option value="coin">🪙 コイン</option><option value="card">🃏 カード</option><option value="egg">🥚 卵</option><option value="ticket_sr">🎟️ SR以上確定チケット</option><option value="kb_ticket">⚔️ 漢字バスターズ挑戦権</option><option value="kb_premium_ticket">👑 プレミアム挑戦権</option><option value="icon">👤 アイコン</option></select></label><label id="numberBox">コイン数・枚数<input id="num" type="number" min="1" max="99999" value="100"></label><label id="itemBox" class="hidden">カードID・卵ID・アイコン<input id="item" placeholder="ゲーム内で使用しているID"></label><label>メッセージ<textarea id="msg" maxlength="120" rows="2"></textarea></label><label>配布先<select id="target"><option value="broadcast">全プレイヤー</option><option value="personal">プレイヤーを指定</option></select></label><label id="recipientBox" class="hidden">プレイヤー名<input id="recipient"></label><button id="send">📬 プレゼントを直接送る</button><button id="makeCode">🔑 従来型コードを作る</button><textarea id="output" class="hidden" readonly rows="4"></textarea><p class="muted">直接配布はゲームで使用している announcements / gift_delivery 方式です。従来型コードは既存のゲームで使える長いコードです。</p></section><section class="box"><h2>🔢 7桁コード登録</h2><div class="notice muted">注意：この画面では7桁コードを登録できますが、現在のゲームは数字コードの引き換えに未対応です。受け取り機能を追加するまで児童には配らないでください。</div><label>7桁の数字<input id="code" inputmode="numeric" maxlength="7" placeholder="1234567"></label><button id="random">🎲 重ならない番号を選ぶ</button><button id="register">コードを登録</button></section><section class="box"><h2>📜 履歴</h2><button id="refresh">🔄 更新</button><div id="history"></div></section></div><p id="status" role="status"></p></main><script>
const config={apiKey:'AIzaSyBpC_YgEG6-T70HwSlB3__MDI70WNsxqiQ',authDomain:'janken-kingdom.firebaseapp.com',projectId:'janken-kingdom',storageBucket:'janken-kingdom.firebasestorage.app',messagingSenderId:'748399805019',appId:'1:748399805019:web:b3d6dc75ccf551bef3357e'};firebase.initializeApp(config);const auth=firebase.auth(),db=firebase.firestore(),E=id=>document.getElementById(id),status=s=>E('status').textContent=s;
E('kind').onchange=()=>{const k=E('kind').value;E('numberBox').classList.toggle('hidden',['card','egg','icon'].includes(k));E('itemBox').classList.toggle('hidden',!['card','egg','icon'].includes(k))};E('target').onchange=()=>E('recipientBox').classList.toggle('hidden',E('target').value!=='personal');
function payload(){const k=E('kind').value,n=Number(E('num').value),id=E('item').value.trim(),to=E('target').value,name=E('recipient').value.trim();if(to==='personal'&&!name)throw Error('受取人を入力してください');let v={type:k,version:5,distribution:to,recipientName:to==='personal'?name:'',message:E('msg').value.trim().slice(0,120),received:false,active:true,createdAt:Date.now()};if(k==='coin'){if(!Number.isInteger(n)||n<1||n>99999)throw Error('コインは1〜99999');v.amount=n}else if(k.includes('ticket')){if(!Number.isInteger(n)||n<1||n>99)throw Error('枚数は1〜99');v.count=n}else if(k==='card'||k==='egg'){if(!id)throw Error('IDを入力してください');v[k==='card'?'cardId':'eggId']=id}else{if(!id)throw Error('アイコンを入力してください');v.icon=id}return v}
function guard(){if(!auth.currentUser||auth.currentUser.isAnonymous)throw Error('ログインしてください')}
E('login').onclick=async()=>{try{await auth.signInWithEmailAndPassword(E('email').value.trim(),E('password').value);status('ログインしました')}catch(e){status('ログイン失敗：'+e.message)}};E('logout').onclick=()=>auth.signOut();auth.onAuthStateChanged(u=>{const ok=!!u&&!u.isAnonymous;E('loginBox').classList.toggle('hidden',ok);E('mainBox').classList.toggle('hidden',!ok);E('who').textContent=ok?u.email:'';if(ok)refresh()});
E('send').onclick=async()=>{try{guard();let p=payload();if(!confirm('プレゼントを配布しますか？'))return;let id='__gift_'+(p.distribution==='personal'?'personal_':'broadcast_')+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);await db.collection('announcements').doc(id).set({...p,id,cloudSourceId:id,internalType:'gift_delivery'});status('✅ 配布しました');refresh()}catch(e){status('❌ '+e.message)}};
E('makeCode').onclick=()=>{try{const code=btoa(unescape(encodeURIComponent(JSON.stringify(payload()))));E('output').classList.remove('hidden');E('output').value=code;E('output').select();status('✅ 従来型コードを作成しました。コピーして利用できます。')}catch(e){status(e.message)}};
E('random').onclick=async()=>{try{guard();for(let i=0;i<40;i++){let c=String(crypto.getRandomValues(new Uint32Array(1))[0]%9000000+1000000);if(!(await db.collection('giftCodes').doc(c).get()).exists){E('code').value=c;status('✅ 未使用候補です。登録ボタンで確定してください');return}}throw Error('空き番号を見つけられませんでした')}catch(e){status('❌ '+e.message)}};
E('register').onclick=async()=>{try{guard();let code=E('code').value.trim();if(!/^\d{7}$/.test(code))throw Error('7桁の数字を入力してください');let p=payload();let ret=await db.runTransaction(async tx=>{let ref=db.collection('giftCodes').doc(code),s=await tx.get(ref);if(s.exists)return false;tx.set(ref,{...p,code});return true});if(!ret){confirm('今までに同じ番号があります。よろしいですか？\n※安全のため上書きはしません。');status('⚠️ 登録済み番号です。既存の登録は保護しました');return}status('✅ 7桁コードを登録しました（受け取り連携は未実装）');refresh()}catch(e){status('❌ '+e.message)}};
function escape(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}async function refresh(){try{guard();let [a,b]=await Promise.all([db.collection('announcements').where('internalType','==','gift_delivery').limit(75).get(),db.collection('giftCodes').limit(75).get()]);let rows=[...a.docs.map(d=>({...d.data(),source:'配布'})),...b.docs.map(d=>({...d.data(),source:'コード'}))].sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));E('history').innerHTML=rows.length?rows.map(x=>'<div class="entry"><b>'+escape(x.source)+' '+escape(x.code||x.recipientName||'全員')+'</b><p>'+escape(x.type)+' '+escape(x.amount||x.count||x.cardId||x.eggId||x.icon||'')+'</p><small>'+new Date(x.createdAt||Date.now()).toLocaleString('ja-JP')+'</small></div>').join(''):'履歴はありません'}catch(e){E('history').textContent='読み込めません：'+e.message}}E('refresh').onclick=refresh;
</script></body></html>
