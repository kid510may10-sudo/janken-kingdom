const D=[{"area":1,"name":"はじまりの封印門","subject":"国語","scene":"古びた石門に「ことばを知る者だけ進め」とある。","inspect":[["石碑","「第1問は音読み、第2問は訓読み。正解した選択肢の番号を、第1問→第2問の順に並べよ」と刻まれている。"],["植木鉢","土の中から小さな銅の鍵を見つけた！"]],"items":"銅の鍵","qs":[{"q":"「登山」の「登」の読みは？","opts":["と","やま","のぼ","とうざん"],"a":0,"why":"「登山（とざん）」の「登」は「と」と読む。","hint":"「山」の読みは「ざん」。残る「登」の音を考えよう。"},{"q":"「山道」の「道」の読みは？","opts":["どう","みち","とう","じ"],"a":1,"why":"「山道」は「やまみち」。道は「みち」と読む。","hint":"「やま◯◯」と言ってみよう。"}],"gate":"石碑の指示通り、2問の正解の選択肢番号（上から1・2・3・4）を第1問→第2問の順に並べた2桁の暗号は？","answer":"12","clue":"「登山」の「登」は音読み「と」（1番）、「山道」の「道」は訓読み「みち」（2番）。2つの番号を順番に書こう。","explain":"「登山（とざん）」の「登」は音読み「と」、「山道（やまみち）」の「道」は訓読み「みち」。第1問の正解は1番、第2問は2番なので暗号は12。"},{"area":1,"name":"同じ音の図書室","subject":"国語","scene":"本棚に同じ音の言葉が並ぶ。","inspect":[["本棚","「橋・箸・端」同じ読みでも意味は異なる。"],["机の引き出し","紙のしおり鍵を発見。"]],"items":"しおり鍵","qs":[{"q":"「雨がやむ」の「やむ」と近い意味は？","opts":["始まる","止まる","強まる","落ちる"],"a":1,"why":"雨が降り続く状態が止まる意味。","hint":"前後の様子を思い浮かべよう。"},{"q":"「計る」を使う文は？","opts":["熱を計る","長さを計る","時間を計る","歌を計る"],"a":2,"why":"時間をはかる場合は「計る」を使う。長さは「測る」、重さは「量る」が一般的。","hint":"「計」は時間や数の計算と関係。"}],"gate":"本の題名「○○を合わせれば道が開く」。空欄の二字は？","answer":"知恵","clue":"本に「知」と「恵」の切れ端がある。","explain":"「知恵」は知識を生かして考える力。"},{"area":1,"name":"文章の鏡","subject":"国語","scene":"鏡には短い物語が映る。","inspect":[["鏡","「ミナは赤い箱をタクに渡した。タクはそれを机に置いた。」"],["額縁","裏に銀の鍵。"]],"items":"銀の鍵","qs":[{"q":"「それ」が指すものは？","opts":["机","鏡","赤い箱","タク"],"a":2,"why":"直前の文で渡された「赤い箱」を指す。","hint":"「それ」を元の言葉に置きかえてみよう。"},{"q":"文「雨が降った。しかし試合は続いた」の関係は？","opts":["理由","逆の流れ","順序","例示"],"a":1,"why":"「しかし」は前後の予想と異なることを表す接続語。","hint":"「しかし」の前後は期待が反対になる。"}],"gate":"鏡の物語を読み直そう。赤い箱を渡した人の名前をカタカナ2字で入力。","answer":"ミナ","clue":"『ミナは赤い箱をタクに渡した』。主語と目的語に注目。","explain":"だれが・なにを・だれに渡したかを区別する推理。"},{"area":1,"name":"漢字組み立て工房","subject":"国語","scene":"部首の歯車が回っている。","inspect":[["木箱","左側に「氵」、右側に「青」の部品。"],["工具棚","鉄の鍵が落ちている。"]],"items":"鉄の鍵","qs":[{"q":"「氵」と「青」を合わせた漢字は？","opts":["清","晴","情","請"],"a":0,"why":"さんずい＋青＝清。「清い」の清。","hint":"部首の位置を見比べよう。"},{"q":"「言」と「売」を組み合わせると？","opts":["続","読","話","語"],"a":1,"why":"言偏と売で「読」。","hint":"言葉・読むことに関係する偏。"}],"gate":"部品「木＋木＋木」でできる漢字1字を入力。","answer":"森","clue":"三つの木を上下に組み合わせる図。","explain":"同じ漢字を複数組み合わせる漢字もある。"},{"area":1,"name":"俳句の庭","subject":"国語","scene":"五・七・五の庭石が並んでいる。","inspect":[["池","「古池や 蛙飛びこむ 水の音」が書かれている。"],["灯籠","灯籠の中に花の鍵。"]],"items":"花の鍵","qs":[{"q":"俳句の基本的な音数は？","opts":["5・5・7","5・7・5","7・5・7","7・7・5"],"a":1,"why":"俳句の基本は五・七・五の17音。","hint":"声に出して数えよう。"},{"q":"春を表す季語としてふさわしいのは？","opts":["雪だるま","入道雲","桜","紅葉"],"a":2,"why":"桜は春の季語として使われる。","hint":"咲く季節を考えよう。"}],"gate":"「あさひさす」は何音？数字で入力。","answer":"5","clue":"声に出して「あ・さ・ひ・さ・す」と一音ずつ数えよう。","explain":"あ・さ・ひ・さ・す＝5音。小さな「っ」「ゃ」などを含む場合は数え方に注意しよう。"},{"area":2,"name":"大きな数の地下道","subject":"算数","scene":"位取りの石柱が立つ。","inspect":[["石柱","石柱に「2つの学びの答えを使う。ただし一方は100分の1」と刻まれている。"],["土のすきま","石の鍵を発見。"]],"items":"石の鍵","qs":[{"q":"3,050,000は日本語で？","opts":["三十五万","三百五万","三千五十万","三億五千万"],"a":1,"why":"3,050,000=305万（三百五万）。","hint":"右から4けたごとに区切ってみよう。"},{"q":"1億は1万の何倍？","opts":["100倍","1000倍","10000倍","10万倍"],"a":2,"why":"100,000,000÷10,000=10,000。","hint":"0の数の差を見よう。"}],"gate":"石柱の最終封印：「3,050,000」を「万」の単位で表したときの数字と、「1億は1万の何倍か」を表す数字を足せ。ただし、後者は100でわってから足す。答えを数字で入力。","answer":"405","clue":"3,050,000は「305万」。もう一方の答えを100で割った数と足そう。","explain":"305＋(10000÷100)＝405。大きな数を「万」で表してから計算する。"},{"area":2,"name":"わり算の歯車","subject":"算数","scene":"わり算の機械が止まった。","inspect":[["歯車","「第1歯車は商の百の位、第2歯車はあまりだけを読む」と書かれている。"],["操作盤","真ちゅうの鍵を発見。"]],"items":"真ちゅうの鍵","qs":[{"q":"936÷3は？","opts":["302","312","321","332"],"a":1,"why":"936÷3=312。","hint":"900と36に分けてみよう。"},{"q":"47÷6の商とあまりは？","opts":["7あまり5","8あまり1","7あまり6","6あまり11"],"a":0,"why":"6×7=42、47−42=5。","hint":"あまりはわる数より小さい。"}],"gate":"歯車の暗号：第1問の商「936÷3」の百の位と、第2問「47÷6」のあまりを、順番に並べた2桁の数字は？","answer":"35","clue":"まず商を筆算で確かめ、百の位だけを抜き出そう。あまりは別に考える。","explain":"936÷3＝312なので百の位は3。47÷6＝7あまり5なので、3と5をつないで35。"},{"area":2,"name":"角度の塔","subject":"算数","scene":"分度器型の階段がある。","inspect":[["分度器","直角＝90°、一直線＝180°。"],["窓","窓際に青銅の鍵。"]],"items":"青銅の鍵","qs":[{"q":"直角を2つ合わせた角は？","opts":["90°","120°","180°","360°"],"a":2,"why":"90°＋90°＝180°。","hint":"まっすぐな線になるか考える。"},{"q":"正三角形の1つの内角は？","opts":["30°","45°","60°","90°"],"a":2,"why":"正三角形は3つの角が等しく、合計180°なので60°。","hint":"180°を3等分する。"}],"gate":"180°から75°を引いた角度を数字だけ入力。","answer":"105","clue":"階段に「180−75」と書かれる。","explain":"180−75=105。"},{"area":2,"name":"小数の水路","subject":"算数","scene":"水路の目盛りを読まないと橋が上がらない。","inspect":[["目盛り","水路に「二つの流れ（正しい計算結果）を合わせよ」とある。"],["水車","羽根の裏に水の鍵。"]],"items":"水の鍵","qs":[{"q":"0.7＋0.5は？","opts":["0.12","1.2","1.12","12"],"a":1,"why":"0.7＋0.5＝1.2。","hint":"0.1が全部で12個。"},{"q":"3.4−1.8は？","opts":["1.4","1.6","2.4","2.6"],"a":1,"why":"3.4−1.8=1.6。","hint":"小数点の位置をそろえてひく。"}],"gate":"水門の暗号：第1問「0.7＋0.5」の答えと、第2問「3.4−1.8」の答えを足した数を入力せよ。","answer":"2.8","clue":"小数点の位置をそろえて、二つの問題の結果を足そう。","explain":"1.2＋1.6＝2.8。小数第1位までの計算を組み合わせる。"},{"area":2,"name":"折れ線グラフの橋","subject":"算数","scene":"気温の変化を描いた橋。","inspect":[["グラフ","月曜20℃、火曜23℃、水曜21℃、木曜27℃、金曜24℃"],["手すり","端にグラフの鍵が隠されている。"]],"items":"グラフの鍵","qs":[{"q":"気温が最も高い曜日は？","opts":["月曜","火曜","木曜","金曜"],"a":2,"why":"木曜27℃が最大。","hint":"数値を比べよう。"},{"q":"前日からの上がり幅が最大なのは？","opts":["火曜","水曜","木曜","金曜"],"a":2,"why":"水曜21℃→木曜27℃で6℃上がる。","hint":"日ごとの差を求めよう。"}],"gate":"橋の暗号：水曜21℃から木曜27℃への上昇幅と、木曜27℃から金曜24℃への下降幅を足した合計は？数字で。","answer":"9","clue":"上昇幅6℃、下降幅3℃。変化の大きさを足す。","explain":"6+3=9。増減を正負で相殺せず、変化した幅を足す。"},{"area":3,"name":"季節の観測室","subject":"理科","scene":"季節と生き物の観測記録。","inspect":[["観測日誌","春に芽吹き、夏に成長し、秋に実をつける植物。"],["望遠鏡","三脚の下に葉の鍵。"]],"items":"葉の鍵","qs":[{"q":"春によく見られるものは？","opts":["セミの羽化","サクラの開花","紅葉","霜柱"],"a":1,"why":"サクラの開花は春の代表的な観察対象。","hint":"季節ごとの植物の姿を思い出そう。"},{"q":"気温を比べるときの正しい方法は？","opts":["毎回異なる場所","温度計を直射日光に置く","同じ条件で測る","好きな時刻だけ測る"],"a":2,"why":"同じ場所・時刻など条件をそろえると比較しやすい。","hint":"公平な比較に必要なことは？"}],"gate":"春→夏→秋→冬のあとに来る季節をひらがなで入力。","answer":"はる","clue":"季節は繰り返す。","explain":"季節の循環。"},{"area":3,"name":"電気の回廊","subject":"理科","scene":"電気の流れる回路の模型。","inspect":[["回路図","電池・導線・豆電球はつながって輪になると点灯。"],["電池箱","電気の鍵を発見。"]],"items":"電気の鍵","qs":[{"q":"豆電球が点灯するつなぎ方は？","opts":["導線が途中で切れる","回路 const keys=Object.keys(words).sort((a,b)=>b.length-a.length);
const escaped=keys.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
const rex=new RegExp(escaped.join('|'),'g');
let enabled=true,scheduled=false,mutating=false;
function exempt(el){return !!el.closest('ruby,rt,script,style,textarea,input,select,option,code,pre,[data-no-furigana],.choice,.options,.answer,.question,.quiz,.problem,.qbox,.choices');}
function decorate(){if(mutating||!enabled)return;mutating=true;
try{const host=document.querySelector('.wrap')||document.body;
 const walk=document.createTreeWalker(host,NodeFilter.SHOW_TEXT,{acceptNode(n){
 const p=n.parentElement; if(!p||exempt(p)||!n.nodeValue||!/[一-龯]/.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
 // ボタンや入力フィールドにある出題・解答の表示はそのまま。説明ラベルは対象。
 if(p.closest('button') && !p.closest('header,.topbar')) return NodeFilter.FILTER_REJECT;
 if(p.closest('#content')&&p.closest('[onclick]'))return NodeFilter.FILTER_REJECT;
 return NodeFilter.FILTER_ACCEPT;
 }}); const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);
 for(const n of nodes){const t=n.nodeValue;rex.lastIndex=0;if(!rex.test(t))continue;rex.lastIndex=0;
 const f=document.createDocumentFragment();let last=0,m;while((m=rex.exec(t))){if(m.index>last)f.append(document.createTextNode(t.slice(last,m.index)));
 const r=document.createElement('ruby');r.className='grade4-ruby';r.append(document.createTextNode(m[0]));const rt=document.createElement('rt');rt.textContent=words[m[0]];r.append(rt);f.append(r);last=rex.lastIndex;
 }if(last<t.length)f.append(document.createTextNode(t.slice(last)));n.replaceWith(f);
 }
}finally{mutating=false;}}
function queue(){if(scheduled||!enabled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;decorate();});}
const observer=new MutationObserver(()=>{if(!mutating)queue();});
function init(){const control=document.createElement('button');control.type='button';control.id='furiganaControl';control.textContent='🔤 よみがな ON';control.setAttribute('aria-label','よみがなの表示切り替え');control.addEventListener('click',()=>{enabled=!enabled;control.textContent=enabled?'🔤 よみがな ON':'🔤 よみがな OFF';if(enabled){queue();}else{document.querySelectorAll('ruby.grade4-ruby').forEach(r=>r.replaceWith(document.createTextNode(r.firstChild.textContent)));}});
 document.body.append(control);observer.observe(document.body,{subtree:true,childList:true,characterData:false});queue();}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
