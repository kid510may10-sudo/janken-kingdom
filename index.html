<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>じゃんけんキングダム | バージョン選択</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 0%,#40316c,#130e27 65%,#090715);color:#fff;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(520px,100%);text-align:center}h1{font-size:clamp(27px,7vw,39px);margin:12px 0 5px}.sub{color:#cbbde8;margin-bottom:30px}.choice{display:block;text-align:left;text-decoration:none;color:#fff;padding:21px;border-radius:18px;border:1px solid #7868a8;background:#241c3c;margin:13px 0;box-shadow:0 7px 24px #0005}.choice b{display:block;font-size:21px;margin-bottom:7px}.choice span{font-size:13px;color:#d3c9e8;line-height:1.7}.choice.mobile{border-color:#6dc6b1;background:#173b39}.note{font-size:12px;color:#c4b8d8;line-height:1.7;margin-top:22px}.admin{margin-top:25px;padding:20px;border:1px solid #63547e;border-radius:18px;background:#1d1831;text-align:left}.admin h2{font-size:17px;margin:0 0 13px}form{display:flex;gap:9px}input{flex:1;min-width:0;padding:13px 12px;background:#100d20;color:white;border:1px solid #75678e;border-radius:10px;font-size:16px}button{padding:12px 18px;border:0;border-radius:10px;background:#bea2ff;color:#171025;font-size:15px;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ffdd82;outline-offset:3px}.error{font-size:13px;color:#ffb7c0;min-height:18px;margin:8px 0 0}.admin-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.admin-link{text-decoration:none;text-align:center;background:#30264d;border:1px solid #7868a8;border-radius:12px;padding:16px 8px;color:#fff;font-size:14px;font-weight:650}.admin-link:hover{background:#463466}.admin-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.logout{background:#342b4c;color:#eee;font-size:12px;padding:9px}[hidden]{display:none!important}
</style></head><body><main class="wrap"><div style="font-size:55px">🏰⚔️</div><h1>じゃんけんキングダム</h1><p class="sub">遊びたいバージョンを選んでね！</p>
<a class="choice mobile" href="./mobile.html"><b>📱 スマホ軽量版　›</b><span>スマホでも遊びやすいプレイヤー専用版。</span></a>
<a class="choice" href="./classic.html"><b>🖥️ 従来の完全版　›</b><span>これまでの機能を利用できる従来版。パソコン向け。</span></a>
<section class="admin" aria-label="管理者メニュー"><div id="locked"><h2>🔐 管理者メニュー</h2><form id="adminForm" autocomplete="off"><input id="adminPassword" type="password" placeholder="パスワード" aria-label="管理者パスワード" autocomplete="off" required><button type="submit">開く</button></form><p class="error" id="adminError" role="status" aria-live="polite"></p></div>
<div id="unlocked" hidden><div class="admin-head"><h2>⚙️ 管理ページを選択</h2><button type="button" id="logout" class="logout">閉じる</button></div><nav class="admin-list" aria-label="管理ページ一覧"><a class="admin-link" href="./admin/cards/index.html">🃏 カード管理</a><a class="admin-link" href="./admin/pets/index.html">🥚 ペット・卵管理</a><a class="admin-link" href="./admin/gacha/index.html">🎰 ガチャ管理</a><a class="admin-link" href="./admin/market/index.html">🛒 マーケット管理</a><a class="admin-link" href="./admin/quests/index.html">🗺️ クエスト管理</a><a class="admin-link" href="./admin/challenges/index.html">🏆 チャレンジ管理</a></nav></div></section>
<p class="note">どちらのバージョンも同じゲームデータを利用します。</p></main>
<script>
(()=>{
const digest='714992b3a857615af44ceef19b11bbd3d3bfc0ad25bb654add5ed78635846dee';
const key='jk_admin_menu_unlocked';
const locked=document.getElementById('locked'),unlocked=document.getElementById('unlocked'),input=document.getElementById('adminPassword'),error=document.getElementById('adminError');
function show(open){locked.hidden=open;unlocked.hidden=!open;error.textContent='';if(!open)input.value='';}
show(sessionStorage.getItem(key)==='1');
async function check(v){const data=new TextEncoder().encode('jk-portal-2026-10-v1:'+v);const b=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')===digest;}
document.getElementById('adminForm').addEventListener('submit',async e=>{e.preventDefault();error.textContent='';try{if(await check(input.value)){sessionStorage.setItem(key,'1');show(true);}else{input.value='';error.textContent='パスワードが違います。';}}catch(_){error.textContent='認証処理を実行できませんでした。';}});
document.getElementById('logout').addEventListener('click',()=>{sessionStorage.removeItem(key);show(false);});
})();
</script></body></html>
