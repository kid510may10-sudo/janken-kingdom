<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15111d"><title>じゃんけんキングダム・カード効果＆バランス編集</title>
<script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#15111d;--p:#251e31;--line:#534765;--text:#fff9ee;--muted:#beb2cc;--gold:#f6c654;--good:#79e8aa;--bad:#ff9b9b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#352843,#17121f 48%,#0e0b13);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:1050px;margin:auto;padding:14px}.panel{background:#251e31ee;border:1px solid #4d405e;border-radius:18px;padding:14px;margin-bottom:12px}.sub{background:#1b1624}.hidden{display:none!important}h1{font-size:21px;margin:0 0 8px}.muted{font-size:12px;color:var(--muted);line-height:1.55}.field{margin:9px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border-radius:11px;border:1px solid #564868;background:#17121f;color:white;font:inherit}.field textarea{min-height:90px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:1.4fr .6fr 1fr;gap:9px}.list{display:grid;gap:7px;max-height:58vh;overflow:auto}.card{background:#19141f;border:1px solid #4e405e;border-radius:13px;padding:10px}.card b{font-size:13px}.card small{display:block;color:#bcaec7;margin-top:3px}.tag{font-size:9px;padding:2px 6px;border-radius:999px;background:#332842;border:1px solid #584869;margin-left:4px}button{border:0;border-radius:12px;padding:11px 13px;font-weight:900;font:inherit}.primary{background:linear-gradient(135deg,#ffe078,#efa83c);color:#2a1b06}.secondary{background:#3a304c;color:white;border:1px solid #5c4e72}.danger{background:#5a2630;color:#fff;border:1px solid #8a3c4a}.ok{color:var(--good)}.err{color:var(--bad)}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1}.warn{padding:9px;border-radius:11px;background:#342b18;border:1px solid #806a31;color:#ffe9a8;font-size:12px}.effectRow{padding:10px;border:1px solid #4d405e;border-radius:13px;margin:8px 0;background:#17121f}.sticky{position:sticky;bottom:8px;z-index:5;background:#211a2baa;border:1px solid #5c4e72;backdrop-filter:blur(8px);padding:8px;border-radius:14px}@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}.actions button{flex-basis:100%}}
</style></head><body><div class="wrap">
<div class="panel"><h1>⚖️ じゃんけんキングダム・カード効果＆バランス編集</h1><div class="muted">カード一覧が空になる不具合を修正した版。Firebaseと本体の端末保存を両方読み込み、IDで統合して表示します。</div></div>
<div id="loginPanel" class="panel"><div class="field"><label>教員メールアドレス</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"></div><button class="primary" style="width:100%" onclick="login()">ログイン</button><div id="loginStatus" class="muted"></div></div>
<div id="main" class="hidden">
 <div class="panel"><div class="actions"><b style="flex:3">📚 カード一覧</b><button class="secondary" onclick="reloadNow()">🔄 再読込</button><button class="secondary" onclick="logout()">ログアウト</button></div><div id="sourceStatus" class="muted" style="margin:8px 0"></div><div class="grid2"><div class="field"><input id="search" placeholder="カード名・効果・種族で検索" oninput="renderList()"></div><div class="field"><select id="sort" onchange="renderList()"><option value="rarity_desc">レア度 高い順</option><option value="name">名前順</option></select></div></div><div id="list" class="list"></div></div>
 <div id="editor" class="panel hidden"><div class="warn">編集中：<b id="editingLabel"></b>　カードIDは変更しません。</div>
  <div class="grid2"><div class="field"><label>カード名</label><input id="name"></div><div class="field"><label>カードタイプ</label><select id="cardType"><option value="normal">通常</option><option value="special">必殺</option><option value="evolution">進化</option><option value="incarnation">化身</option></select></div><div class="field"><label>じゃんけん</label><select id="hand"><option value="rock">✊ グー</option><option value="scissors">✌️ チョキ</option><option value="paper">✋ パー</option><option value="none">なし</option></select></div><div class="field"><label>種族</label><select id="attr"></select></div><div class="field"><label>レアリティ</label><select id="rarity"><option>N</option><option>R</option><option>SR</option><option>UR</option><option>AR</option><option>P</option></select></div><div class="field"><label>表示説明</label><input id="desc"></div></div>
  <label><input id="discardImmune" type="checkbox"> 🛡️ 手札から捨てられない</label>
  <div class="panel sub"><b>💥 効果（最大3つ）</b><div id="effects"></div></div>
  <details class="panel sub" open><summary><b>🧩 完全編集：カードデータJSON</b></summary><div class="muted">進化・化身・覚醒・究極進化など細かな設定はここで保持・編集できます。フォームで触らない未知の項目も保存時に残します。</div><textarea id="rawJson" style="width:100%;min-height:330px;margin-top:8px;background:#0f0c13;color:#dff;border:1px solid #4d405e;border-radius:10px;padding:10px"></textarea><div class="actions"><button class="secondary" onclick="applyRawJson()">JSON → フォーム反映</button><button class="secondary" onclick="refreshRawFromForm()">フォーム → JSON更新</button></div></details>
  <div class="sticky actions"><button class="primary" onclick="saveCard()">💾 上書き保存</button><button class="secondary" onclick="cancelEdit()">キャンセル</button></div><div id="status" class="muted"></div>
 </div>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBpC_YgEG6-T70HwSlB3__MDI70WNsxqiQ",authDomain:"janken-kingdom.firebaseapp.com",projectId:"janken-kingdom",storageBucket:"janken-kingdom.firebasestorage.app",messagingSenderId:"748399805019",appId:"1:748399805019:web:b3d6dc75ccf551bef3357e"};
let auth,db,cards=[],cloudCards=[],packs=[],editing=null; const $=id=>document.getElementById(id); const clone=o=>JSON.parse(JSON.stringify(o??{})); const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const ATTRS=[['none','無属性'],['vampire','🧛 バンパイア'],['dragon','🐉 ドラゴン'],['beast','🐺 ビースト'],['elf','🧝 エルフ'],['undead','💀 アンデッド'],['machine','🤖 マシン'],['spirit','✨ スピリット'],['knight','🛡️ ナイト'],['mage','🧙 メイジ'],['christmas','🎄 クリスマス'],['dog','🐶 ドッグ'],['god','👑 神'],['animal','🐾 アニマル'],['yoma','👹 妖魔']];
const EFFECTS=[['normal','効果なし'],['win_plus','勝利ボーナス'],['tie_plus','あいこボーナス'],['lose_plus','敗北ボーナス'],['op_minus_win','勝利時ポイント破壊'],['op_minus_any','相手ポイント減少'],['drain_win','ポイント吸収'],['reveal_on_win','勝ったら手札を見る'],['reveal_any','手札を1枚見る'],['reveal_two_win','勝ったら2枚見る'],['cancel','相手効果を無効'],['seal_next','次ターン効果封印'],['hand_lock','次ターン手を封じる'],['protect','妨害耐性'],['comeback','劣勢ボーナス'],['lead_bonus','リードボーナス'],['first_round','序盤ボーナス'],['late_round','終盤ボーナス'],['streak','連勝ボーナス'],['revenge','リベンジ'],['same_hand_combo','同じ手コンボ'],['different_hand_combo','手チェンジコンボ'],['attribute_combo','属性コンボ'],['attr_win_bonus','属性勝利ボーナス'],['counter_rock','グー狩り'],['counter_scissors','チョキ狩り'],['counter_paper','パー狩り'],['op_high_punish','高得点メタ'],['self_low_boost','ピンチ強化'],['double_base_win','基本勝利点2倍'],['tie_to_win','あいこ勝利化'],['loss_cancel','敗北点無効'],['copy_op','相手効果コピー'],['random_plus','ランダム加点'],['trash_bonus','トラッシュ枚数ボーナス'],['unique_attr','多属性ボーナス'],['robot_assemble','ロボ完成'],['swap_hand','手札交換'],['recycle_used','リサイクル再使用'],['copy_hand_effect','手札効果コピー'],['custom_recipe','自由効果']];
const RANK={N:0,R:1,SR:2,UR:3,AR:4,P:5};
const CARD_CHUNK_PREFIX="__cardchunk__";function cardChunkPrefix(id){return `${CARD_CHUNK_PREFIX}${String(id).replace(/[^A-Za-z0-9_-]/g,"_")}__`;}
function optAttrs(){return ATTRS.map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}
function readLocalArray(key){try{const x=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(x)?x:[]}catch(e){console.warn(e);return []}}
function mergeById(a,b){const m=new Map();[...(a||[]),...(b||[])].forEach(x=>{if(x&&x.id!=null)m.set(String(x.id),x)});return [...m.values()]}
function decodeCardsFromCloudSnapshot(snap){const docs=snap.docs.map(d=>({id:d.id,...d.data()}));const chunks=new Map();docs.filter(x=>x.__cardChunk&&x.parentId).forEach(x=>{if(!chunks.has(x.parentId))chunks.set(x.parentId,[]);chunks.get(x.parentId).push(x)});const out=[];docs.filter(x=>!x.__cardChunk&&!String(x.id||"").startsWith(CARD_CHUNK_PREFIX)).forEach(x=>{if(x.__chunkedCard){try{const parts=(chunks.get(x.id)||[]).sort((a,b)=>Number(a.index)-Number(b.index));if(parts.length!==Number(x.chunkCount||0))return;const parsed=JSON.parse(parts.map(p=>p.chunk||"").join(""));out.push({id:x.id,...parsed})}catch(e){console.warn(e)}}else out.push(x)});return out}
function refreshMerged(){const local=readLocalArray('jk_custom_cards_v2');cards=mergeById(local,cloudCards);renderList();$('sourceStatus').textContent=`表示 ${cards.length}枚（クラウド ${cloudCards.length}枚 / 端末保存 ${local.length}枚）`}
window.addEventListener('DOMContentLoaded',()=>{['attr'].forEach(id=>$(id).innerHTML=optAttrs());firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();cards=readLocalArray('jk_custom_cards_v2');renderList();$('sourceStatus').textContent=`端末保存から ${cards.length}枚を先に読み込みました。ログイン後にクラウドと統合します。`;auth.onAuthStateChanged(u=>{if(u){$('loginPanel').classList.add('hidden');$('main').classList.remove('hidden');watchData()}else{$('loginPanel').classList.remove('hidden');$('main').classList.add('hidden')}})});
async function login(){try{$('loginStatus').textContent='ログイン中…';await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);$('loginStatus').textContent=''}catch(e){$('loginStatus').innerHTML='<span class="err">ログイン失敗：'+esc(e.message)+'</span>'}} async function logout(){await auth.signOut()}
function watchData(){db.collection('cards').onSnapshot(s=>{cloudCards=decodeCardsFromCloudSnapshot(s);refreshMerged();try{localStorage.setItem('jk_custom_cards_v2',JSON.stringify(cards))}catch(e){}},e=>{$('sourceStatus').innerHTML=`<span class="err">クラウド取得失敗：${esc(e.message)}。端末保存カードはそのまま表示します。</span>`;cloudCards=[];refreshMerged()});db.collection('packs').onSnapshot(s=>{packs=s.docs.map(d=>({id:d.id,...d.data()}))},e=>console.warn(e))}
async function reloadNow(){cloudCards=[];refreshMerged();try{const s=await db.collection('cards').get();cloudCards=decodeCardsFromCloudSnapshot(s);refreshMerged()}catch(e){$('sourceStatus').innerHTML=`<span class="err">再読込失敗：${esc(e.message)}</span>`}}
function cardEffects(c){return Array.isArray(c?.effects)&&c.effects.length?c.effects:[{kind:c?.kind||'normal',value:c?.value??0,effectConfig:c?.effectConfig||{},effectRecipe:c?.effectRecipe||null}]}
function renderList(){const q=($('search')?.value||'').trim().toLowerCase();let a=cards.filter(c=>!q||JSON.stringify(c).toLowerCase().includes(q));const s=$('sort')?.value||'rarity_desc';a.sort((x,y)=>s==='name'?String(x.name||'').localeCompare(String(y.name||''),'ja'):(RANK[y.rarity]??0)-(RANK[x.rarity]??0));$('list').innerHTML=a.map(c=>`<div class="card"><b>${esc(c.name||c.id)} <span class="tag">${esc(c.rarity||'N')}</span></b><small>${esc(c.attr||'none')} / ${cardEffects(c).map(e=>EFFECTS.find(x=>x[0]===e.kind)?.[1]||e.kind).join(' + ')}</small><button class="secondary" style="width:100%;margin-top:7px" onclick="editCard('${String(c.id).replace(/'/g,"\\'")}')">✏️ 編集</button></div>`).join('')||(q?'<div class="muted">検索条件に一致するカードがありません。</div>':'<div class="warn">カードが0枚です。本体を同じブラウザで一度開いてから再読込するか、教員ログイン後にクラウド取得を確認してください。</div>')}
function effectRow(i,e={kind:'normal',value:0,effectConfig:{},effectRecipe:null}){return `<div class="effectRow" data-index="${i}"><div class="grid3"><div class="field"><label>効果${i+1}</label><select class="ekind">${EFFECTS.map(x=>`<option value="${x[0]}" ${x[0]===e.kind?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>数値</label><input class="eval" type="number" step="1" value="${Number(e.value)||0}"></div><div class="field"><label>詳細設定JSON</label><textarea class="ecfg">${esc(JSON.stringify(e.effectConfig||{},null,2))}</textarea></div></div></div>`}
function renderEffects(entries){$('effects').innerHTML=[0,1,2].map(i=>effectRow(i,entries[i]||{kind:'normal',value:0,effectConfig:{}})).join('')}
function readEffects(){return [...document.querySelectorAll('.effectRow')].map((r,i)=>{let cfg={};try{cfg=JSON.parse(r.querySelector('.ecfg').value||'{}')}catch(e){throw Error(`効果${i+1}の詳細設定JSONが壊れています`)}return {kind:r.querySelector('.ekind').value,value:Number(r.querySelector('.eval').value)||0,effectConfig:cfg}}).filter((e,i)=>i===0||e.kind!=='normal')}
function editCard(id){let c=cards.find(x=>String(x.id)===String(id));if(!c)return;editing=clone(c);$('editor').classList.remove('hidden');$('editingLabel').textContent=c.name||id;$('name').value=c.name||'';$('cardType').value=c.cardType||'normal';$('hand').value=c.hand||((c.cardType==='special')?'none':'rock');$('attr').value=c.attr||'none';$('rarity').value=c.rarity||'N';$('desc').value=c.desc||'';$('discardImmune').checked=!!c.discardImmune;renderEffects(cardEffects(c));$('rawJson').value=JSON.stringify(c,null,2);$('editor').scrollIntoView({behavior:'smooth'})}
function buildCard(){if(!editing)throw Error('カードを選んでください');let c=clone(editing);c.name=$('name').value.trim()||c.name;c.cardType=$('cardType').value;c.hand=c.cardType==='special'?'none':$('hand').value;c.attr=$('attr').value;c.rarity=$('rarity').value;c.desc=$('desc').value;c.discardImmune=$('discardImmune').checked;let es=readEffects();c.effects=es;c.kind=es[0]?.kind||'normal';c.value=es[0]?.value||0;c.effectConfig=es[0]?.effectConfig||{};c.id=editing.id;return c}
function refreshRawFromForm(){try{$('rawJson').value=JSON.stringify(buildCard(),null,2)}catch(e){alert(e.message)}}
function applyRawJson(){try{let c=JSON.parse($('rawJson').value);if(String(c.id)!==String(editing.id))throw Error('カードIDは変更できません');editing=clone(c);editCard(c.id);$('status').innerHTML='<span class="ok">✅ JSONをフォームへ反映しました。</span>'}catch(e){$('status').innerHTML='<span class="err">JSON反映失敗：'+esc(e.message)+'</span>'}}
async function cleanupCardChunks(id,keepCount=0){const pref=cardChunkPrefix(id);const snap=await db.collection('cards').get();const dels=snap.docs.filter(d=>d.id.startsWith(pref)).filter(d=>{const n=Number(d.id.slice(pref.length));return !Number.isFinite(n)||n>=keepCount});for(let i=0;i<dels.length;i+=400){const batch=db.batch();dels.slice(i,i+400).forEach(d=>batch.delete(d.ref));await batch.commit()}}
async function saveCardCloudAware(id,data){const clean=JSON.parse(JSON.stringify(data));const raw=JSON.stringify(clean);const bytes=new TextEncoder().encode(raw).length;if(bytes>700000){const chunkSize=300000,parts=[];for(let i=0;i<raw.length;i+=chunkSize)parts.push(raw.slice(i,i+chunkSize));for(let i=0;i<parts.length;i++)await db.collection('cards').doc(cardChunkPrefix(id)+i).set({__cardChunk:true,parentId:id,index:i,chunk:parts[i]});await db.collection('cards').doc(id).set({id,__chunkedCard:true,chunkCount:parts.length,updatedAt:Date.now()},{merge:false});await cleanupCardChunks(id,parts.length)}else{await db.collection('cards').doc(id).set(clean,{merge:false});await cleanupCardChunks(id,0)}}
async function saveCard(){try{let c=buildCard();$('status').textContent='保存中…';let local=readLocalArray('jk_custom_cards_v2');const idx=local.findIndex(x=>String(x.id)===String(c.id));if(idx>=0)local[idx]=c;else local.push(c);localStorage.setItem('jk_custom_cards_v2',JSON.stringify(local));try{await saveCardCloudAware(c.id,c);$('status').innerHTML='<span class="ok">✅ 端末保存＋Firebaseへ保存しました。</span>'}catch(cloudErr){console.error(cloudErr);$('status').innerHTML='<span class="err">⚠️ 端末保存は完了。Firebase保存だけ失敗：'+esc(cloudErr.message)+'</span>'}editing=clone(c);refreshMerged();$('rawJson').value=JSON.stringify(c,null,2)}catch(e){$('status').innerHTML='<span class="err">保存できません：'+esc(e.message)+'</span>'}}
function cancelEdit(){editing=null;$('editor').classList.add('hidden');$('status').textContent=''}
</script></body></html>
