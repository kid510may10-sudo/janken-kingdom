<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夢の効果工房｜カード管理連携パッチ</title><style>body{font-family:system-ui,sans-serif;background:#100d1b;color:#f4edff;margin:0;padding:18px}main{max-width:640px;margin:25px auto;background:#241a35;padding:22px;border-radius:17px;border:1px solid #76618a;line-height:1.7}button,input{font:inherit}button{padding:13px;border:0;background:#ffe088;color:#291a09;font-weight:bold;border-radius:12px;width:100%;margin:7px 0}input{display:block;width:100%;box-sizing:border-box;padding:12px;background:#120f1c;color:white;border:1px solid #7d688e;border-radius:9px}p{font-size:14px;color:#d7cde2}</style></head><body><main><h1>🌙 カード管理連携パッチ</h1><p>既存のカード管理HTMLを選ぶと、夢の効果を受け取るボタンを追加した <b>index.html</b> を作ります。元のカード管理の設定・機能はそのまま残します。変換はこのブラウザの中だけで行い、ファイルを送信しません。</p><label>現在の <code>admin/cards/index.html</code> を選ぶ<input id="source" type="file" accept=".html,text/html"></label><button id="run">修正版 index.html を作る</button><div id="msg"></div><p>作った <code>index.html</code> をGitHubの <code>admin/cards/index.html</code> に上書きし、<code>dream-card-bridge.js</code> を <code>admin/cards/</code> に追加してください。</p></main><script>
const btn=document.getElementById('run'),msg=document.getElementById('msg');btn.onclick=async()=>{try{const f=document.getElementById('source').files[0];if(!f)throw Error('現在のカード管理HTMLを先に選択してください。');let h=await f.text();if(!h.includes('id="effectRows"')||!h.includes('function saveCard(')||!h.includes('</body>'))throw Error('カード管理のHTMLではないか、内容が対応していません。');if(!h.includes('dream-card-bridge.js'))h=h.replace(/<\/body>/i,'<script defer src="dream-card-bridge.js"><\/script>\n</body>');const b=new Blob([h],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='index.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);msg.textContent='✅ 修正版を生成したよ。元のカード管理HTMLは変更していません。'}catch(e){msg.textContent='❌ '+e.message}};
</script></body></html>
